<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Blackwood support</title>
<!-- No outside fonts or scripts: a page that shows authenticator secrets
     loads nothing from any other website. System fonts are used instead. -->
<!-- ═══════════════════════════════════════════════════════════════
     support-agent.html — the support agents' page, at /support.
     Built from the approved prototype (support-agents-prototype.html).

     Sign-in, one-time setup and the Inbox on one page. The Inbox is YOUR
     Inbox's own code (from admin.html), unchanged except four marked
     lines, talking to the agents' server routes through a small
     translator below. So both Inboxes behave the same, and a fix to
     yours can be carried across by copying the block again.

     Nothing here decides what an agent may see — the server does
     (support-route.js: agentMay, forAgentThread). This page could be
     edited by anyone with developer tools and still receive nothing it
     should not.
═══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#0b0b11; --bg2:#0e0e15;
  --surface:rgba(255,255,255,.026); --surface2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.115);
  --text:#f2f1ee; --muted:#8b8a95; --muted2:#b4b3bd;
  /* Teal where your console is blue — the prototype's colour, so the two
     are never mistaken for each other. The Inbox styles below use these. */
  --steel:#3ecfcf; --steel-lt:#8be6e6; --steel-dim:rgba(62,207,207,.13); --steel-edge:rgba(62,207,207,.34);
  --green:#2fc99a; --green-dim:rgba(47,201,154,.13);
  --red:#ff6b6a; --red-dim:rgba(255,107,106,.13);
  --amber:#f0b64c; --amber-dim:rgba(240,182,76,.13);
  --r:11px; --r-sm:7px; --r-lg:16px;
  color-scheme:dark;
  --ff:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ff);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--steel-dim);color:var(--steel);display:grid;place-items:center;font-weight:800}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted2)}
.who button{border:1px solid var(--line2);background:transparent;border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
.who button:hover{border-color:var(--steel)}
main{padding:20px;max-width:1280px;margin:0 auto}
.sechead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sechead h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em}
.sechead span{color:var(--muted);font-size:12.5px}
.count{font-family:var(--fm);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted2)}
.count.alert{background:var(--steel-dim);color:var(--steel)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.empty b{display:block;color:var(--text);font-size:13.5px;margin-bottom:4px}
/* sign-in and setup */
.auth{max-width:420px;margin:36px auto}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px 22px}
.auth h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.auth .sub{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted2);font-weight:500}
.field input{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14px;outline:none}
.field input:focus{border-color:var(--steel)}
.go{width:100%;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:14px;background:var(--steel);color:#04201f;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.msg{min-height:20px;font-size:12.5px;color:var(--red);margin:2px 0 10px;line-height:1.5}
.fine{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
.step{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--steel);margin:18px 0 8px}
.qr{background:#fff;border-radius:10px;padding:10px;width:max-content;margin:4px auto 10px}
.qr svg{display:block;width:196px;height:196px}
.secret{font-family:var(--fm);font-size:13px;letter-spacing:.06em;text-align:center;background:var(--bg2);border:1px dashed var(--line2);
  border-radius:8px;padding:9px;word-break:break-all;user-select:all}
.applink{display:block;text-align:center;font-size:12.5px;color:var(--steel);margin-top:8px}
/* agent-only additions to the Inbox */
.ib-pass{background:transparent;border:1px solid var(--line2);color:var(--text)}
.ib-pass:hover{border-color:var(--amber);color:var(--amber)}
.ib-lock{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted2);line-height:1.6;background:var(--surface)}
.ib-lock b{color:var(--text)}
/* Saved replies: agents can use and add them, but only the owner removes
   them — the server has no route for it, so the × is not shown. */
.ib-saveddel{display:none!important}
/* ── Inbox (Messages & Inbox) — from the approved prototype. Every class
   is ib-prefixed and every colour is a console variable, so it follows
   the light/dark switch and cannot restyle any other tab. ── */
.ib-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);min-height:520px}
@media(max-width:860px){.ib-wrap{grid-template-columns:1fr}}
.ib-list{border-right:1px solid var(--line);overflow:auto;max-height:78vh}
@media(max-width:860px){.ib-list{border-right:none;border-bottom:1px solid var(--line);max-height:40vh}}
.ib-fil{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ib-fil button{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:4px 10px;font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer}
.ib-fil button.on{background:var(--steel);border-color:var(--steel);color:#fff;font-weight:600}
.ib-row{display:block;width:100%;text-align:left;padding:11px 14px;border:none;border-top:1px solid var(--line);background:transparent;font:inherit;color:inherit;cursor:pointer}
.ib-row:first-child{border-top:none}
.ib-row:hover{background:var(--surface2)}
.ib-row.sel{background:var(--steel-dim);box-shadow:inset 3px 0 0 var(--steel)}
.ib-row .t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.ib-row .t .u{width:7px;height:7px;border-radius:50%;background:var(--steel);flex-shrink:0}
.ib-row .e{font-size:11.5px;color:var(--muted2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-row .f{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ib-topic{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted2);font-weight:500}
.ib-topic.lic{background:var(--red-dim);color:var(--red)}
.ib-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.ib-pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ib-pill.received{background:rgba(160,140,240,.15);color:#8f7be8}
.ib-pill.review{background:var(--steel-dim);color:var(--steel)}
.ib-pill.waiting{background:var(--amber-dim);color:var(--amber)}
.ib-pill.resolved{background:var(--green-dim);color:var(--green)}
.ib-view{padding:16px 18px 24px;overflow:auto;max-height:78vh;contain:content}
.ib-list{contain:content}
/* off-screen messages are not drawn until scrolled into view */
.ib-m{content-visibility:auto;contain-intrinsic-size:auto 64px}
.ib-none{padding:48px 16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.ib-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ib-head h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em}
.ib-head .who{color:var(--muted2);font-size:12.5px;margin-top:2px}
.ib-link{border:none;background:none;padding:0;font:inherit;color:var(--steel);cursor:pointer}
.ib-link:hover{text-decoration:underline}
.ib-track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:6px 0 18px}
.ib-track .rail{position:absolute;left:12.5%;right:12.5%;top:13px;height:3px;border-radius:3px;background:var(--line2)}
.ib-track .fill{position:absolute;left:12.5%;top:13px;height:3px;border-radius:3px;background:var(--steel);
  width:75%;transform-origin:left center;   /* scaled to the stage reached — slides on the graphics card */
  transition:transform .7s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px var(--steel-edge)}
.ib-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;z-index:1;background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.ib-step .dot{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--bg2);border:2px solid var(--line2);color:var(--muted);transition:all .5s}
.ib-step:hover .dot{border-color:var(--steel-lt)}
.ib-step .lbl{font-size:11px;color:var(--muted);font-weight:500;text-align:center;line-height:1.3}
.ib-step.done .dot{background:var(--steel);border-color:var(--steel);color:#fff}
.ib-step.done .lbl{color:var(--text)}
.ib-step.now .dot{border-color:var(--steel);color:var(--steel);position:relative}
/* The pulse used to animate box-shadow — a repaint of the page on every
   frame, and this console has blurred bars that re-blurred each time. A
   ring that scales and fades runs on the graphics card instead. */
.ib-step.now .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--steel);
  opacity:0;pointer-events:none;animation:ibring 2.2s ease-out infinite;will-change:transform,opacity}
@keyframes ibring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.ib-step.now .lbl{color:var(--steel);font-weight:600}
.ib-step:disabled{cursor:wait}
@media (prefers-reduced-motion:reduce){.ib-step.now .dot::after{animation:none}.ib-track .fill{transition:none}}
.ib-plan{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.ib-plan-free{background:var(--surface2);color:var(--muted2)}
.ib-plan-pro,.ib-plan-pro_monthly{background:var(--steel-dim);color:var(--steel)}
.ib-plan-pro_yearly{background:rgba(160,140,240,.16);color:#8f7be8}
.ib-plan-lifetime{background:var(--amber-dim);color:var(--amber)}
.ib-lic{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.ib-lic i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ib-lic-paused,.ib-lic-banned,.ib-lic-suspended{background:var(--red-dim);color:var(--red)}
.ib-lic-warned{background:var(--amber-dim);color:var(--amber)}
.ib-lic-clear{background:var(--green-dim);color:var(--green)}
.ib-rate{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.ib-rate.yes{background:var(--green-dim);color:var(--green)}
.ib-rate.no{background:var(--red-dim);color:var(--red)}
.ib-stale{font-size:11px;color:var(--amber)}
.ib-savedwrap{position:relative;display:inline-block}
.ib-savedbtn{background:transparent;border:1px solid var(--line2);color:var(--text)}
.ib-savedmenu{position:absolute;bottom:calc(100% + 6px);left:0;width:360px;max-width:80vw;max-height:320px;overflow:auto;
  background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:6px;z-index:20}
.ib-savedrow{display:flex;align-items:flex-start;gap:4px}
.ib-saveduse{flex:1;text-align:left;background:transparent;border:none;border-radius:7px;padding:8px 10px;font:inherit;
  font-size:12.5px;color:var(--text);line-height:1.5;cursor:pointer}
.ib-saveduse:hover{background:var(--surface2)}
.ib-saveddel{border:none;background:none;color:var(--muted);font-size:15px;padding:6px 8px;cursor:pointer;border-radius:6px}
.ib-saveddel:hover{color:var(--red);background:var(--red-dim)}
.ib-savedadd{display:block;width:100%;text-align:left;background:transparent;border:none;border-top:1px solid var(--line);
  margin-top:4px;padding:9px 10px;font:inherit;font-size:12.5px;color:var(--steel);cursor:pointer}
.ib-savednote{padding:10px;font-size:12px;color:var(--muted)}
.ib-hint{font-size:11.5px;color:var(--muted);margin:-10px 0 14px;text-align:center}
.ib-msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.ib-m{max-width:88%;border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.6;word-wrap:break-word}
.ib-m .who{font-size:11px;font-weight:600;margin-bottom:3px}
.ib-m .when{font-size:10.5px;color:var(--muted);margin-top:5px}
.ib-m.them{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.ib-m.them .who{color:var(--muted2)}
.ib-m.me{align-self:flex-end;background:var(--steel-dim);border:1px solid var(--steel-edge)}
.ib-m.me .who{color:var(--steel)}
.ib-m.sys{align-self:center;max-width:94%;background:transparent;border:1px dashed var(--line2);font-size:12px;text-align:center;color:var(--muted)}
.ib-atts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.ib-att{display:flex;align-items:center;gap:7px;border-radius:7px;padding:5px 8px;font-size:11.5px;border:1px solid var(--line2);
  max-width:220px;background:transparent;color:inherit;text-align:left;cursor:pointer;font-family:inherit}
.ib-att img{width:34px;height:34px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--surface2)}
.ib-att .pdf{width:34px;height:34px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:10px;flex-shrink:0;background:var(--red-dim);color:var(--red)}
.ib-att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:150px}
.ib-att .sz{color:var(--muted);font-size:10.5px}
.ib-comp{border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:10px}
.ib-comp textarea{width:100%;min-height:72px;background:transparent;border:none;outline:none;resize:vertical;font:inherit;font-size:13px;line-height:1.6;color:var(--text);box-sizing:border-box}
.ib-drop{border:1.5px dashed var(--line2);border-radius:8px;padding:10px;text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.ib-drop.over{border-color:var(--steel);color:var(--steel)}
.ib-pend{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.ib-pend .ib-att{cursor:default}
.ib-pend .x{border:none;background:none;color:var(--red);font-weight:700;padding:0 0 0 4px;cursor:pointer;font-size:14px}
.ib-crow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.ib-hintsm{font-size:11px;color:var(--muted)}
.ib-err{font-size:12px;color:var(--red);width:100%}
.ib-btn{border:none;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;font-size:12.5px;background:var(--steel);color:#fff;cursor:pointer}
.ib-btn:disabled{opacity:.45;cursor:not-allowed}
.ib-btn.ask{background:transparent;border:1px solid var(--amber);color:var(--amber)}
.ib-btn.green{background:var(--green);color:#03170f}
.ib-obtn{border:1px solid var(--line2);border-radius:7px;padding:3px 9px;font:inherit;font-size:12px;background:transparent;color:inherit;cursor:pointer;margin-left:4px}
.ib-restore{margin-top:16px;border:1px solid rgba(47,201,154,.32);background:var(--green-dim);border-radius:10px;padding:12px 14px}
.ib-restore b{font-size:13px}
.ib-restore p{margin:4px 0 10px;font-size:12.5px;color:var(--muted2);line-height:1.6}
.ib-restore .prev{border-left:2px solid var(--green);padding:8px 11px;font-size:12.5px;color:var(--text);line-height:1.65;margin-bottom:10px;background:var(--surface)}
.ib-lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px}
.ib-lb.on{display:flex}
.ib-lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="mark">B</span>Blackwood support</div>
  <div class="who" id="who" hidden><span id="who-name"></span><button id="signout">Sign out</button></div>
</header>
<main>

  <!-- ── Sign in ── -->
  <section id="v-login" class="auth" hidden>
    <div class="card">
      <h2>Sign in</h2>
      <p class="sub">For the Blackwood support team. This is not the owner's console.</p>
      <form id="login-form" autocomplete="on" novalidate>
        <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="l-code">Two-factor code</label>
          <input id="l-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="6 digits from your authenticator app" required></div>
        <div class="msg" id="l-msg" role="alert"></div>
        <button class="go" id="l-go" type="submit">Sign in</button>
      </form>
      <p class="fine">Locked out, or lost your authenticator? Ask the owner to reset your access — you will get a new setup link.</p>
    </div>
  </section>

  <!-- ── One-time setup ── -->
  <section id="v-setup" class="auth" hidden>
    <div class="card" id="setup-card"><div class="empty">Opening your setup…</div></div>
  </section>

  <!-- ── Inbox (the owner's Inbox markup) ── -->
  <section id="v-inbox" hidden>
    <div class="sechead"><h3>Inbox <span class="count" id="c-inbox">—</span></h3><span id="ib-mode">—</span></div>
    <div class="ib-wrap">
      <div class="ib-list"><div class="ib-fil" id="ib-fil"></div><div id="ib-rows"><div class="empty"><b>Loading</b>Reading the inbox…</div></div></div>
      <div class="ib-view" id="ib-view"><div class="ib-none">Select a conversation.</div></div>
    </div>
  </section>

</main>

<script>
/* qrcode-generator 1.4.4 — draws the setup QR code in the page itself, so
   an agent's authenticator secret is never sent to another website. */

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

          }

/* ═══ The translator ═══════════════════════════════════════════════
   The Inbox code below was written for YOUR console's routes. These two
   functions give it the same names and shapes, but send every request to

   agent may see. Anything else (Restore, removing saved replies) has no
   agent route at all and is refused here too. */
const AGENT_API = '/support/api';
async function call(method, path, body) {
  const r = await fetch(AGENT_API + path, { method, credentials: 'same-origin',
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined });

  if (r.status === 401 && path !== '/login') { showLogin('Your session has ended — please sign in again.'); throw new Error('Please sign in again'); }
  if (!r.ok) { const e = new Error(d.error || ('Something went wrong (' + r.status + ')')); e.status = r.status; throw e; }
  return d;

                      planActive: t.customer.planActive, licence: t.customer.status });
const asCustomer = c => ({ lastName: c.name, email: c.email, plan: c.plan, planActive: c.planActive, licence: c.status });
async function api(path) {
  if (path.startsWith('support?')) { const d = await call('GET', '/threads'); return { openCount: d.openCount, threads: d.threads.map(asRow) }; }
  let m = /^support\/([0-9a-f-]{36})$/i.exec(path);
  if (m) { const d = await call('GET', '/threads/' + m[1]); return { thread: d.thread, customer: asCustomer(d.customer), canRestore: false }; }
  m = /^support-files\/([0-9a-f-]{36})$/i.exec(path); if (m) return call('GET', '/files/' + m[1]);
  if (path === 'support-saved') return call('GET', '/saved');
  throw new Error('Not available here');
}

  const m = /^support\/([0-9a-f-]{36})\/(uploads|reply|stage)$/i.exec(path);
  if (m) return call('POST', '/threads/' + m[1] + '/' + m[2], body || {});
  if (path === 'support-saved') return call('POST', '/saved', body);

<script>

    const pdf = a.type === 'application/pdf';
    return `<button class="ib-att" data-att="${esc(a.id)}" data-kind="${pdf ? 'pdf' : 'img'}">

      <span><span class="nm">${esc(a.name)}</span><span class="sz">${ibKb(a.size)}</span></span></button>`; }).join('');
  return `<div class="ib-m ${mine ? 'me' : 'them'}"><div class="who">${mine ? 'Blackwood support' : esc(c.lastName || c.email || 'Customer')}</div>

    <div class="when">${ago(m.at)}${mine && m.by ? ' · ' + esc(m.by) : ''}</div></div>`;
}

// The reply box — drawn once per conversation.
function ibDrawComposer() {
  const box = $('ib-compbox'); if (!box || !IB.thread) return;
  const last = IB.customer && IB.customer.lastName ? IB.customer.lastName : 'the customer';
  box.innerHTML = `<div class="ib-comp"><textarea id="ib-text" data-autocorrect maxlength="5000" aria-label="Reply" spellcheck="true" autocorrect="on" autocapitalize="sentences" placeholder="Reply to ${esc(last)}…"></textarea>
    <div class="ib-drop" id="ib-drop">Drop screenshots or PDFs here, or <button class="ib-obtn" id="ib-pick">choose files</button></div>
    <input type="file" id="ib-file" multiple accept="${IB_TYPES.join(',')}" hidden>
    <div class="ib-pend" id="ib-pend"></div>
    <div class="ib-crow"><span class="ib-hintsm">Images or PDFs · up to 5 · 10 MB each</span>
      <button class="ib-btn" id="ib-send" style="margin-left:auto">Send reply</button><div class="ib-err" id="ib-err"></div></div></div>
    <div class="ib-crow" style="margin-top:8px"><button class="ib-btn ask" id="ib-ask">Send &amp; mark “Waiting on you”</button>
      <span class="ib-savedwrap"><button class="ib-btn ib-savedbtn" id="ib-saved" aria-haspopup="true" aria-expanded="false">Saved replies ▾</button>
        <div class="ib-savedmenu" id="ib-savedmenu" role="menu" hidden></div></span></div>`;
  $('ib-pick').onclick = () => $('ib-file').click();

  const drop = $('ib-drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); ibTake(e.dataTransfer.files); };
  $('ib-send').onclick = () => ibSend(false);
  $('ib-saved').onclick = e => { e.stopPropagation(); ibSavedToggle(); };
  $('ib-ask').onclick = () => ibSend(true);

}
function ibTake(list) {
  const errs = [];
  for (const f of list) {
    if (IB.pending.length >= 5) { errs.push('Up to 5 files per message.'); break; }
    if (!IB_TYPES.includes(f.type)) { errs.push(f.name + ': only images (PNG, JPG, WebP, GIF) and PDFs are accepted.'); continue; }
    if (f.size > 10 * 1024 * 1024) { errs.push(f.name + ': larger than 10 MB.'); continue; }
    IB.pending.push({ file: f, url: f.type === 'application/pdf' ? '' : URL.createObjectURL(f) });
  }
  IB.fileErr = errs.join(' ');           // kept, so redrawing the files cannot wipe it
  ibDrawPending();
}
function ibDrawPending() {
  const box = $('ib-pend'); if (!box) return;
  box.innerHTML = IB.pending.map((p, i) => `<span class="ib-att">${p.url ? `<img alt="" src="${p.url}">` : '<span class="pdf">PDF</span>'}
    <span><span class="nm">${esc(p.file.name)}</span><span class="sz">${ibKb(p.file.size)}</span></span>
    <button class="x" data-i="${i}" aria-label="Remove ${esc(p.file.name)}">×</button></span>`).join('');
  box.querySelectorAll('.x').forEach(x => x.onclick = () => {
    const p = IB.pending.splice(+x.dataset.i, 1)[0]; if (p && p.url) URL.revokeObjectURL(p.url); ibDrawPending(); });
  if ($('ib-err')) $('ib-err').textContent = IB.fileErr || '';
}

async function ibSend(ask) {
  if (IB.busy || !IB.thread) return;
  const text = ($('ib-text').value || '').trim();
  if (!text && !IB.pending.length) { $('ib-err').textContent = 'Write a reply first.'; return; }
  const id = IB.thread.id;
  IB.busy = true; $('ib-send').disabled = true; $('ib-ask').disabled = true;
  const btn = ask ? $('ib-ask') : $('ib-send'), label = btn.textContent;
  btn.textContent = IB.pending.length ? 'Uploading…' : 'Sending…';
  try {
    const attachments = [];
    if (IB.pending.length) {
      const up = await apiPost('support/' + id + '/uploads',
        { files: IB.pending.map(p => ({ name: p.file.name, type: p.file.type, size: p.file.size })) });
      for (let i = 0; i < up.uploads.length; i++) {
        const u = up.uploads[i], f = IB.pending[i].file;
        const r = await fetch(u.uploadUrl, { method: 'PUT', headers: { 'Content-Type': f.type, 'x-upsert': 'false' }, body: f });
        if (!r.ok) throw new Error(f.name + ' could not be uploaded — please try again.');
        attachments.push({ path: u.path, name: f.name });
      }
    }
    const d = await apiPost('support/' + id + '/reply', { body: text, attachments, ask: !!ask });
    IB.thread = d.thread; IB.sig = ibSig(d.thread, IB.customer, IB.canRestore); IB.pending = []; IB.fileErr = '';
    $('ib-text').value = '';
    ibDrawConvo(); ibDrawPending(); ibDrawRestore(); loadInbox();
  } catch (e) { $('ib-err').textContent = e.message; }
  finally { IB.busy = false; if ($('ib-send')) { $('ib-send').disabled = false; $('ib-ask').disabled = false; btn.textContent = label; } }
}

async function ibStage(stage) {
  if (IB.busy || !IB.thread || stage === IB.thread.stage) return;
  IB.busy = true;
  document.querySelectorAll('.ib-step').forEach(b => b.disabled = true);
  try {
    const d = await apiPost('support/' + IB.thread.id + '/stage', { stage });
    IB.thread = d.thread; IB.sig = ibSig(d.thread, IB.customer, IB.canRestore);
    ibDrawConvo(); ibDrawRestore(); loadInbox();
  } catch (e) { alert('Could not move the stage:\n\n' + e.message); ibDrawConvo(); }
  finally { IB.busy = false; }
}

// Restore access & notify — only on a licence conversation whose customer
// is actually paused, as in the prototype (the server checks the same).
function ibDrawRestore() {
  const box = $('ib-restorebox'); if (!box) return;
  const show = IB.canRestore && IB.thread && IB.thread.stage !== 'resolved';
  box.innerHTML = show ? `<div class="ib-restore"><b>Checks done? Restore access</b>
    <p>Reopens the Pro Dashboard, clears and accepts their licence setup, marks this conversation resolved, and shows the customer this message on their account page:</p>
    <div class="prev">${esc(IB_RESTORE_TEXT)}</div>
    <button class="ib-btn green" id="ib-restore">Restore access &amp; notify</button></div>` : '';
  const b = $('ib-restore'); if (b) b.onclick = ibRestore;
}
async function ibRestore() {
  const c = IB.customer || {};
  if (!confirm('Restore access for ' + (c.lastName || c.email || 'this customer') + '?\n\nTheir Pro Dashboard reopens straight away, their licence setup is accepted, and they are emailed.')) return;
  const b = $('ib-restore'); b.disabled = true; b.textContent = 'Restoring…';
  try {
    const d = await apiPost('support/' + IB.thread.id + '/restore');
    IB.thread = d.thread; IB.canRestore = false; IB.sig = ibSig(d.thread, IB.customer, false);
    ibDrawConvo(); ibDrawRestore(); loadInbox();
  } catch (e) { alert('Could not restore access:\n\n' + e.message); b.disabled = false; b.textContent = 'Restore access & notify'; }
}

function ibSig(t, c, r) {
  const last = t.messages[t.messages.length - 1] || {};
  return [t.stage, t.messages.length, last.id, t.rating, t.remindedAt, r, c && c.plan, c && c.licence].join('|');
}
async function ibPoll() {
  if (document.hidden || !IB.thread || IB.busy) return;
  const id = IB.thread.id;
  try {
    const d = await api('support/' + id);
    if (!IB.thread || IB.thread.id !== id) return;
    // Nothing new → nothing redrawn. Rebuilding every message and reloading
    // every screenshot every 20 seconds is what made typing stutter.
    const sig = ibSig(d.thread, d.customer, d.canRestore);
    if (sig === IB.sig) return;
    IB.thread = d.thread; IB.customer = d.customer; IB.canRestore = d.canRestore; IB.sig = sig;
    ibDrawConvo(); ibDrawRestore();
  } catch (e) {}
}
function ibStop() { if (IB.timer) { clearInterval(IB.timer); IB.timer = null; } }


/* ── Saved replies ─────────────────────────────────────────────────
   Choosing one ADDS it after whatever is already typed and never sends
   it — so it can be edited first, and one slip cannot send a canned
   answer to someone who asked something else. The menu is its own
   element, so opening it never redraws the reply box. */
async function ibSavedToggle(force) {
  const m = $('ib-savedmenu'), b = $('ib-saved'); if (!m) return;
  const open = force === undefined ? m.hidden : force;
  m.hidden = !open; b.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (!open) return;
  if (!IB.saved) {
    m.innerHTML = '<div class="ib-savednote">Loading…</div>';
    try { IB.saved = (await api('support-saved')).replies || []; }
    catch (e) { m.innerHTML = '<div class="ib-savednote">Could not load saved replies.</div>'; return; }
  }
  ibSavedDraw();
}
function ibSavedDraw() {
  const m = $('ib-savedmenu'); if (!m) return;
  m.innerHTML = (IB.saved.length ? IB.saved.map(r => `<div class="ib-savedrow">
      <button class="ib-saveduse" role="menuitem" data-id="${esc(r.id)}">${esc(r.body)}</button>
      <button class="ib-saveddel" data-del="${esc(r.id)}" aria-label="Remove this saved reply">×</button></div>`).join('')
    : '<div class="ib-savednote">No saved replies yet.</div>')
    + '<button class="ib-savedadd" role="menuitem" id="ib-savecur">＋ Save what is in the box as a reply</button>';
  m.querySelectorAll('.ib-saveduse').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const r = IB.saved.find(x => x.id === b.dataset.id), ta = $('ib-text'); if (!r || !ta) return;
    ta.value = ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n\n' + r.body : r.body;
    ibSavedToggle(false); ta.focus();
  });
  m.querySelectorAll('.ib-saveddel').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    if (!confirm('Remove this saved reply?')) return;
    try { const r = await fetch('/admin/api/support-saved/' + encodeURIComponent(b.dataset.del), { method: 'DELETE', credentials: 'same-origin' });
          if (r.status === 401) { location.href = '/admin/login'; return; }
          if (!r.ok) throw new Error('HTTP ' + r.status);
          IB.saved = IB.saved.filter(x => x.id !== b.dataset.del); ibSavedDraw(); }
    catch (err) { alert('Could not remove it:\n\n' + err.message); }
  });
  $('ib-savecur').onclick = async e => {
    e.stopPropagation();
    const txt = ($('ib-text').value || '').trim();
    if (!txt) { alert('Type the reply first, then save it.'); return; }
    try { const d = await apiPost('support-saved', { body: txt });
          if (!d.existed) IB.saved.push(d.reply); ibSavedDraw(); }
    catch (err) { alert('Could not save it:\n\n' + err.message); }
  };
}
// Click anywhere else, or Escape, closes it.
document.addEventListener('click', e => { const m = $('ib-savedmenu'); if (m && !m.hidden && !m.contains(e.target)) ibSavedToggle(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') ibSavedToggle(false); });

// Five-minute links, fetched only when a file is looked at.
async function ibFileUrl(id) {
  const c = IB.urls[id]; if (c && c.until > Date.now()) return c.url;
  const d = await api('support-files/' + id);
  IB.urls[id] = { url: d.url, until: Date.now() + (d.expiresIn || 300) * 800 };
  return d.url;
}
async function ibOpenFile(id, kind) {

      lb.onclick = () => lb.classList.remove('on'); document.body.appendChild(lb); }
    lb.innerHTML = ''; const img = document.createElement('img'); img.src = u; img.alt = ''; lb.appendChild(img);
    lb.classList.add('on');

// "open in Licence sharing →" — straight to that customer's drawer.

<script>
/* ═══ Agent-only additions ═════════════════════════════════════════ */

// Pass to owner, and the reminder of what only the owner can do — added
// under the Inbox's own reply box.
const _drawComposer = ibDrawComposer;
ibDrawComposer = function () {
  _drawComposer();
  const box = $('ib-compbox'); if (!box || !IB.thread) return;

  const extra = document.createElement('div');

      <span class="ib-hintsm">It leaves your Inbox, and the customer sees nothing change.</span></div>
    <div class="ib-lock">🔒 <b>Only the owner can</b> restore access, pause or ban, and see licence keys, sharing evidence or payments.
      ${c.licence && c.licence !== 'clear' ? ' This customer\'s status looks like a licence matter — <b>Pass to owner</b> hands it over.' : ''}</div>`;
  box.appendChild(extra);
  $('ib-pass').onclick = ibPass;
};
async function ibPass() {
  const t = IB.thread; if (!t || IB.busy) return;
  if (!confirm('Pass "' + t.subject + '" to the owner?\n\nIt leaves your Inbox, and you will not be able to open it again.')) return;
  IB.busy = true;
  try {
    await call('POST', '/threads/' + t.id + '/pass', {});
    ibStop(); IB.thread = null; IB.sel = null;
    $('ib-view').innerHTML = '<div class="ib-none">Passed to the owner.<br>It has left your Inbox.</div>';
    IB.listSig = null; loadInbox();

}


/* ── Live updates ────────────────────────────────────────────────
   The server now says the moment a conversation changes, instead of the
   Inbox asking every 30 seconds. Only an id arrives; the Inbox then
   fetches through its normal route. Several changes close together are
   gathered into one refresh. The 30-second timers stay as a safety net,
   and the browser reconnects by itself if the connection drops. */
function ibLive(url) {
  if (!window.EventSource) return null;
  const es = new EventSource(url, { withCredentials: true });
  const ids = new Set(); let t = null;
  const flush = () => {
    t = null;
    if (document.hidden) { IB.missed = true; return; }        // catch up when you come back
    const open = IB.thread && ids.has(IB.thread.id);
    ids.clear();
    loadInbox();
    if (open) ibPoll();
  };
  es.onmessage = e => {
    try { ids.add(JSON.parse(e.data).id); } catch (x) { return; }
    if (!t) t = setTimeout(flush, 250);
  };
  return es;
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && IB.missed) { IB.missed = false; loadInbox(); if (IB.thread) ibPoll(); }
});

/* ── Which screen ── */
let listTimer = null, liveConn = null;
function show(view) {
  ['login', 'setup', 'inbox'].forEach(v => $('v-' + v).hidden = v !== view);
  $('who').hidden = view !== 'inbox';
  if (view !== 'inbox') { ibStop(); if (listTimer) { clearInterval(listTimer); listTimer = null; }
    if (liveConn) { liveConn.close(); liveConn = null; } }
}
function showLogin(message) {
  show('login');
  $('l-msg').textContent = message || '';
  $('l-go').disabled = false;
}
function showInbox(agent) {
  $('who-name').textContent = agent.name;
  show('inbox');
  IB.listSig = null; loadInbox();
  if (!listTimer) listTimer = setInterval(() => { if (!document.hidden) loadInbox(); }, 30000);
  if (!liveConn) liveConn = ibLive('/support/api/stream');
}

/* ── Sign in ── */
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('l-go'); btn.disabled = true; $('l-msg').textContent = '';
  try {
    const d = await call('POST', '/login', { email: $('l-email').value, password: $('l-pass').value, code: $('l-code').value });
    $('l-pass').value = ''; $('l-code').value = '';
    showInbox(d.agent);
  } catch (err) {
    $('l-msg').textContent = err.message; $('l-code').value = ''; btn.disabled = false;
  }
});
$('signout').onclick = async () => {

  IB.thread = null; IB.sel = null; IB.all = []; IB.rows = [];

/* ── One-time setup ── */
async function startSetup(token) {
  show('setup');
  const card = $('setup-card');
  let d;
  try { d = await call('POST', '/setup/start', { token }); }
  catch (e) {
    card.innerHTML = `<h2>This link has ended</h2><p class="sub">${esc(e.message)}</p>`;
    return;
  }
  const qr = qrcode(0, 'M'); qr.addData(d.otpauth); qr.make();
  card.innerHTML = `
    <h2>Welcome, ${esc(d.name.split(' ')[0])}</h2>
    <p class="sub">Set up your sign-in for Blackwood support. This link works once.</p>
    <div class="step">1 · Your authenticator app</div>
    <p class="sub" style="margin-bottom:8px">Scan this with Google Authenticator, Microsoft Authenticator, 1Password or similar.</p>
    <div class="qr" aria-label="QR code for your authenticator app">${qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}</div>
    <div class="secret" title="If you cannot scan, type this into your app">${esc(d.secret.match(/.{1,4}/g).join(' '))}</div>
    <a class="applink" href="${esc(d.otpauth)}">On this phone? Open it in your authenticator app</a>
    <div class="step">2 · Your password</div>
    <form id="setup-form" novalidate>
      <input type="email" value="${esc(d.email)}" autocomplete="username" hidden readonly>
      <div class="field"><label for="s-pass">Choose a password — at least 12 characters</label>
        <input id="s-pass" type="password" autocomplete="new-password" minlength="12" required></div>
      <div class="field"><label for="s-pass2">Type it again</label><input id="s-pass2" type="password" autocomplete="new-password" required></div>
      <div class="field"><label for="s-code">The 6-digit code your app now shows</label>
        <input id="s-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required></div>
      <div class="msg" id="s-msg" role="alert"></div>
      <button class="go" id="s-go" type="submit">Finish and sign in</button>
    </form>`;
  $('setup-form').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('s-pass').value, p2 = $('s-pass2').value, msg = $('s-msg'), btn = $('s-go');
    msg.textContent = '';
    if (p1.length < 12) { msg.textContent = 'Choose a password of at least 12 characters.'; return; }
    if (p1 !== p2) { msg.textContent = 'The two passwords do not match.'; return; }
    btn.disabled = true;
    try {
      const r = await call('POST', '/setup/finish', { token, password: p1, code: $('s-code').value });
      showInbox(r.agent);
    } catch (err) { msg.textContent = err.message; btn.disabled = false; }
  });
}

/* ── Start ── */
(async function boot() {
  // The setup link carries its token after the #, which is never sent to
  // any server log or to other sites. Read it, then remove it from the
  // address bar so it is not left in history or on a shared screen.
  const token = location.pathname.replace(/\/+$/, '').endsWith('/setup') ? location.hash.slice(1) : '';
  if (token) {
    history.replaceState(null, '', '/support/setup');
    return startSetup(token);
  }
  try { const d = await call('GET', '/me'); showInbox(d.agent); }
  catch (e) { if (!$('v-login').hidden) return; showLogin(e.status === 503 ? e.message : ''); }
})();
