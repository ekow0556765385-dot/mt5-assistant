<!-- smc-panel.html v2 — with confluence alerts -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d1a; font-family: 'Segoe UI', sans-serif; color: #e0e0f0; }

  .header {
    padding: 16px 20px;
    background: #12122a;
    border-bottom: 1px solid #2a2a4a;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header h1 { font-size: 16px; color: #a0a8ff; }
  .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #00c864; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    padding: 16px;
  }

  /* Confluence banner — full width */
  .confluence-section {
    padding: 0 16px 16px;
  }
  .confluence-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #ffd700;
    margin-bottom: 10px;
  }
  .confluence-alert {
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,140,0,0.06));
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
  }
  .confluence-alert.bull { border-color: rgba(0,200,100,0.3); background: linear-gradient(135deg,rgba(0,200,100,0.07),rgba(0,150,80,0.05)); }
  .confluence-alert.bear { border-color: rgba(255,80,80,0.3);  background: linear-gradient(135deg,rgba(255,80,80,0.07),rgba(200,40,40,0.05)); }
  .ca-label  { font-size: 13px; font-weight: bold; }
  .ca-label.bull { color: #00c864; }
  .ca-label.bear { color: #ff6060; }
  .ca-detail { font-size: 11px; color: #aaa; margin-top: 3px; }
  .ca-price  { font-family: monospace; font-size: 13px; color: #fff; text-align: right; }
  .ca-zones  { font-size: 10px; color: #888; margin-top: 3px; text-align: right; }
  .ca-badge  {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 10px; font-weight: bold; margin-left: 6px;
  }
  .ca-badge.bull { background: rgba(0,200,100,0.15); color: #00c864; }
  .ca-badge.bear { background: rgba(255,80,80,0.15);  color: #ff6060; }

  .no-confluence { font-size: 12px; color: #555; font-style: italic; padding: 8px 0; }

  /* SMC cards */
  .smc-card {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 14px;
  }
  .smc-card h3 { font-size: 15px; color: #a0a8ff; display: flex; justify-content: space-between; margin-bottom: 10px; }
  .smc-card h3 span.tf { font-size: 11px; color: #555; font-weight: normal; margin-top: 3px; }
  .smc-section { margin-bottom: 10px; }
  .smc-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 5px; }
  .smc-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px; border-radius: 5px; margin-bottom: 3px; font-size: 12px;
  }
  .bull-row  { background: rgba(0,200,100,0.10); color: #00c864; }
  .bear-row  { background: rgba(255,80,80,0.10);  color: #ff6060; }
  .bos-bull  { background: rgba(50,130,255,0.10); color: #5090ff; }
  .bos-bear  { background: rgba(255,140,0,0.10);  color: #ff8c00; }
  .choch-bull{ background: rgba(180,0,255,0.10);  color: #cc55ff; }
  .choch-bear{ background: rgba(255,200,0,0.10);  color: #ffd700; }
  .smc-row .level { font-family: monospace; font-size: 11px; opacity: 0.8; }
  .smc-timestamp { font-size: 10px; color: #444; text-align: right; margin-top: 8px; }
  .no-data { color: #444; font-size: 12px; font-style: italic; }

  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 10px; font-weight: bold; margin-right: 6px;
  }
</style>

<div class="header">
  <div class="dot"></div>
  <h1>Smart Money Concepts — Live Dashboard</h1>
</div>

<!-- Confluence Section -->
<div class="confluence-section" style="padding-top:16px;">
  <div class="confluence-title">⚡ Confluence Alerts — Pattern + OB + FVG Aligned</div>
  <div id="confluenceContainer">
    <div class="no-confluence">No confluence signals detected yet...</div>
  </div>
</div>

<!-- SMC Cards -->
<div class="grid" id="smcGrid">
  <p style="color:#555;padding:16px;font-size:13px;">Waiting for SMC data from MT5...</p>
</div>

<script>
(function () {
  const grid      = document.getElementById('smcGrid');
  const confContainer = document.getElementById('confluenceContainer');

  function typeClass(type) {
    const m = { BOS_Bull:'bos-bull', BOS_Bear:'bos-bear', CHoCH_Bull:'choch-bull', CHoCH_Bear:'choch-bear' };
    return m[type] || '';
  }

  function badge(type) {
    const m = {
      BOS_Bull:   ['BOS ↑','#5090ff'], BOS_Bear:  ['BOS ↓','#ff8c00'],
      CHoCH_Bull: ['CHoCH ↑','#cc55ff'], CHoCH_Bear:['CHoCH ↓','#ffd700']
    };
    const [label, color] = m[type] || [type,'#aaa'];
    return `<span class="badge" style="background:${color}22;color:${color}">${label}</span>`;
  }

  function renderConfluence(allConfluence) {
    const alerts = Object.values(allConfluence).flat()
      .sort((a,b) => new Date(b.time) - new Date(a.time))
      .slice(0, 10);

    if (!alerts.length) {
      confContainer.innerHTML = '<div class="no-confluence">No confluence signals detected yet...</div>';
      return;
    }

    confContainer.innerHTML = alerts.map(a => {
      const isBull = a.direction === 'bullish';
      const cls    = isBull ? 'bull' : 'bear';
      const icon   = isBull ? '🟢' : '🔴';
      const time   = new Date(a.time).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      return `
        <div class="confluence-alert ${cls}">
          <div>
            <div class="ca-label ${cls}">${icon} ${a.symbol} · ${a.timeframe}
              <span class="ca-badge ${cls}">${a.confidence}%</span>
            </div>
            <div class="ca-detail">${a.pattern} · ${time}</div>
          </div>
          <div>
            <div class="ca-price">${parseFloat(a.price).toFixed(5)}</div>
            <div class="ca-zones">
              OB: ${parseFloat(a.ob.high).toFixed(5)}–${parseFloat(a.ob.low).toFixed(5)}<br>
              FVG: ${parseFloat(a.fvg.high).toFixed(5)}–${parseFloat(a.fvg.low).toFixed(5)}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderCard(sym, data) {
    const structs = data.structure   || [];
    const obs     = data.orderBlocks || [];
    const fvgs    = data.fvgs        || [];

    const structHTML = structs.length === 0
      ? '<div class="no-data">No recent structure events</div>'
      : structs.map(s => `
          <div class="smc-row ${typeClass(s.type)}">
            ${badge(s.type)}
            <span>${s.time}</span>
            <span class="level">${parseFloat(s.level).toFixed(5)}</span>
          </div>`).join('');

    const obHTML = obs.length === 0
      ? '<div class="no-data">No active order blocks</div>'
      : obs.map(o => `
          <div class="smc-row ${o.direction==='Bullish'?'bull-row':'bear-row'}">
            <span>${o.direction} OB</span>
            <span class="level">${parseFloat(o.high).toFixed(5)} – ${parseFloat(o.low).toFixed(5)}</span>
          </div>`).join('');

    const fvgHTML = fvgs.length === 0
      ? '<div class="no-data">No unfilled FVGs</div>'
      : fvgs.map(f => `
          <div class="smc-row ${f.direction==='Bullish'?'bull-row':'bear-row'}">
            <span>${f.direction} FVG</span>
            <span class="level">${parseFloat(f.high).toFixed(5)} – ${parseFloat(f.low).toFixed(5)}</span>
          </div>`).join('');

    const updated = data.receivedAt
      ? new Date(data.receivedAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' })
      : data.timestamp;

    return `
      <div class="smc-card">
        <h3>${sym} <span class="tf">${data.timeframe || ''}</span></h3>
        <div class="smc-section">
          <div class="smc-section-title">📐 Structure (BOS / CHoCH)</div>
          ${structHTML}
        </div>
        <div class="smc-section">
          <div class="smc-section-title">🧱 Order Blocks</div>
          ${obHTML}
        </div>
        <div class="smc-section">
          <div class="smc-section-title">⬜ Fair Value Gaps</div>
          ${fvgHTML}
        </div>
        <div class="smc-timestamp">Updated: ${updated}</div>
      </div>`;
  }

  async function refresh() {
    try {
      const [smcRes, confRes] = await Promise.all([
        fetch('/smc'),
        fetch('/confluence')
      ]);
      const smcData  = await smcRes.json();
      const confData = await confRes.json();

      const syms = Object.keys(smcData);
      if (syms.length) {
        grid.innerHTML = syms.map(sym => renderCard(sym, smcData[sym])).join('');
      }

      renderConfluence(confData);
    } catch (e) {
      console.warn('SMC fetch error:', e);
    }
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
