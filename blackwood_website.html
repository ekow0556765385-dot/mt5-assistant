<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood — Smart Money Trading Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
/* ── THEME TOKENS ──────────────────────────────── */
:root,[data-theme="dark"]{
  --bg:#09090e;--surface:#0f0f16;--card:#14141c;--card2:#191922;
  --border:#22222e;--border2:#2e2e3e;
  --gold:#c9820a;--gold-lt:#e09b2a;
  --green:#17a97a;--red:#e0504f;
  --text:#eceae0;--muted:#72706a;--muted2:#9a9890;
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --nav-bg:#09090e;
  --wordmark-color:#eceae0;
  --ticker-bg:#0f0f16;
  --trust-bg:#0f0f16;
}
[data-theme="light"]{
  --bg:#f8f7f2;--surface:#ffffff;--card:#f0ede6;--card2:#e8e4db;
  --border:#d8d4cc;--border2:#c8c4bc;
  --gold:#c9820a;--gold-lt:#e09b2a;
  --green:#0f7a54;--red:#c03838;
  --text:#1a1814;--muted:#8a8678;--muted2:#6a6660;
  --shadow:0 24px 60px rgba(0,0,0,.1);
  --nav-bg:#f8f7f2;
  --wordmark-color:#1a1814;
  --ticker-bg:#ffffff;
  --trust-bg:#ffffff;
}

/* ── RESET ─────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
button{font-family:'Inter',system-ui,sans-serif;cursor:pointer}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── WORDMARK LOGO ─────────────────────────────── */
.bw-logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.bw-logo .tree-icon{height:34px;width:auto;display:block;filter:var(--tree-filter);transition:filter .25s,opacity .2s}
[data-theme="dark"] .bw-logo .tree-icon{filter:brightness(0) invert(1) sepia(0.2) saturate(1.2)}
[data-theme="light"] .bw-logo .tree-icon{filter:brightness(0)}
.bw-logo:hover .tree-icon{opacity:.75}
.bw-logo .wordmark{font-size:16px;font-weight:800;letter-spacing:.08em;color:var(--wordmark-color);text-transform:uppercase;transition:color .25s;line-height:1}

/* Footer wordmark */
.footer-bw-logo{display:flex;align-items:center;gap:9px;margin-bottom:1rem}
.footer-bw-logo .tree-icon{height:30px;width:auto;opacity:.75}
[data-theme="dark"] .footer-bw-logo .tree-icon{filter:brightness(0) invert(1)}
[data-theme="light"] .footer-bw-logo .tree-icon{filter:brightness(0)}
.footer-bw-logo .wordmark{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--wordmark-color);text-transform:uppercase;transition:color .25s}

/* Mobile nav logo */
.mob-bw-logo{display:flex;align-items:center;gap:10px;margin-bottom:.5rem}
.mob-bw-logo .tree-icon{height:48px;width:auto}
[data-theme="dark"] .mob-bw-logo .tree-icon{filter:brightness(0) invert(1)}
[data-theme="light"] .mob-bw-logo .tree-icon{filter:brightness(0)}
.mob-bw-logo .wordmark{font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--wordmark-color);text-transform:uppercase}

/* Hero big logo */
.hero-bw-logo{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:2.5rem}
.hero-bw-logo .tree-icon{height:80px;width:auto;filter:drop-shadow(0 4px 24px rgba(201,130,10,.28))}
[data-theme="dark"] .hero-bw-logo .tree-icon{filter:brightness(0) invert(1) drop-shadow(0 4px 24px rgba(201,130,10,.25)) sepia(0.3) saturate(1.5) hue-rotate(-10deg)}
[data-theme="light"] .hero-bw-logo .tree-icon{filter:brightness(0) drop-shadow(0 4px 20px rgba(0,0,0,.15))}
.hero-bw-logo .wordmark{font-size:clamp(28px,5vw,52px);font-weight:800;letter-spacing:.1em;color:var(--wordmark-color);text-transform:uppercase;transition:color .25s;line-height:1}

/* ── THEME TOGGLE ──────────────────────────────── */
/* ── THEME TOGGLE ── */
.theme-toggle{position:relative;width:44px;height:24px;border-radius:12px;border:.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;transition:border-color .3s}
.theme-toggle:hover{border-color:var(--gold)}
.toggle-track{position:absolute;inset:0;border-radius:12px;overflow:hidden}
.toggle-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#191970;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;transition:all .3s}
[data-theme="light"] .toggle-knob{transform:translateX(20px);background:var(--gold);box-shadow:0 1px 6px rgba(201,130,10,.5);}
.toggle-icon-night{font-size:10px}
.toggle-icon-day{font-size:10px}
.toggle-icon-night,.toggle-icon-day{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:opacity .25s}
.toggle-icon-night{opacity:1}
.toggle-icon-day{opacity:0}
[data-theme="light"] .toggle-icon-night{opacity:0}
[data-theme="light"] .toggle-icon-day{opacity:1}

/* ── UTILITY ───────────────────────────────────── */
.wrap{max-width:1160px;margin:0 auto;padding:0 2.5rem}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:.5px solid rgba(201,130,10,.3);background:rgba(201,130,10,.07);padding:4px 10px;border-radius:4px}
.h2{font-size:clamp(24px,3vw,38px);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-bottom:.75rem;color:var(--text);transition:color .25s}
.sub{font-size:15px;color:var(--muted2);line-height:1.75;max-width:560px;transition:color .25s}
.divider{height:.5px;background:linear-gradient(90deg,transparent,var(--border2) 20%,var(--border2) 80%,transparent)}
.gold-rule{height:1px;background:linear-gradient(90deg,transparent,rgba(201,130,10,.4),transparent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 26px;font-size:13.5px;font-weight:600;border-radius:6px;border:none;transition:all .18s;white-space:nowrap}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold-lt);transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,130,10,.3)}
.btn-ghost{background:transparent;color:var(--text);border:.5px solid var(--border2)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}

/* ── NAV ───────────────────────────────────────── */
#nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;background:var(--nav-bg);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:.5px solid rgba(34,34,46,.3)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%}
.nav-links{display:flex;gap:2rem}
.nav-links a{font-size:13px;color:var(--muted2);transition:color .18s;position:relative;padding-bottom:2px}
.nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1.5px;background:var(--gold);transition:width .22s}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-badge{font-size:11px;color:var(--muted);border:.5px solid var(--border2);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;transition:border-color .25s}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;padding:4px}

/* ── TICKER ─────────────────────────────────────── */
.ticker{background:var(--ticker-bg);border-bottom:.5px solid var(--border);padding:8px 0;overflow:hidden;transition:background .25s}
.ticker-track{display:inline-flex;gap:2.5rem;animation:scroll-left 28s linear infinite}
.ticker-track:hover{animation-play-state:paused}
@keyframes scroll-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}
.tick-sym{font-weight:700;color:var(--muted2);letter-spacing:.04em}
.tick-price{color:var(--text)}
.tick-up{color:var(--green)}
.tick-dn{color:var(--red)}
.tick-sep{color:var(--border2);font-size:16px;margin:0 .5rem}

/* ── HERO ──────────────────────────────────────── */
.hero{padding:100px 2.5rem 80px;text-align:center;position:relative;overflow:hidden}
.hero-glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,130,10,.07) 0%,transparent 70%);pointer-events:none;z-index:0}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(128,128,128,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(128,128,128,.04) 1px,transparent 1px);background-size:60px 60px;opacity:.5;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);opacity:.9;margin-bottom:1.5rem}
.hero-eyebrow span{width:20px;height:.5px;background:var(--gold);opacity:.6}
.hero h1{font-size:clamp(40px,6vw,74px);font-weight:800;line-height:1.02;letter-spacing:-.04em;margin-bottom:1.4rem;color:var(--text);transition:color .25s}
.hero h1 .gold{color:var(--gold)}
.hero-desc{font-size:17px;color:var(--muted2);max-width:560px;margin:0 auto 2.5rem;line-height:1.8}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:3.5rem}
.hero-stats-bar{display:flex;justify-content:center;border:.5px solid var(--border2);border-radius:6px;overflow:hidden;max-width:620px;margin:0 auto;transition:border-color .25s}
.hero-stat{flex:1;padding:18px 16px;text-align:center;border-right:.5px solid var(--border2);background:var(--surface);transition:background .25s,border-color .25s}
.hero-stat:last-child{border-right:none}
.hero-stat .n{font-size:26px;font-weight:800;color:var(--gold);letter-spacing:-.02em}
.hero-stat .l{font-size:11px;color:var(--muted);margin-top:3px}

/* ── TRUST BAR ──────────────────────────────────── */
.trust-bar{padding:24px 0;background:var(--trust-bg);border-bottom:.5px solid var(--border);transition:background .25s}
.trust-inner{display:flex;align-items:center;justify-content:center;gap:2.5rem;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2)}
.trust-item i{color:var(--gold);font-size:15px}
.trust-sep{width:.5px;height:20px;background:var(--border2)}

/* ── HOW IT WORKS ───────────────────────────────── */
.how-section{padding:100px 0;background:var(--bg);transition:background .25s}
.how-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:.5px solid var(--border);border-radius:6px;overflow:hidden;margin-top:3rem;transition:background .25s}
.step{background:var(--surface);padding:2rem 1.75rem;position:relative;transition:background .2s}
.step:hover{background:var(--card)}
.step-num{font-size:11px;font-weight:700;color:var(--gold);opacity:.45;letter-spacing:.12em;margin-bottom:1.25rem}
.step-icon{font-size:26px;color:var(--gold);margin-bottom:1rem}
.step h3{font-size:14px;font-weight:700;margin-bottom:.5rem;color:var(--text)}
.step p{font-size:12.5px;color:var(--muted2);line-height:1.65}
.step-arrow{position:absolute;top:50%;right:-14px;transform:translateY(-50%);width:28px;height:28px;background:var(--card2);border:.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted2)}
.step:last-child .step-arrow{display:none}

/* ── FEATURES ───────────────────────────────────── */
.feat-section{padding:100px 0;background:var(--surface);transition:background .25s}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;background:var(--border);border:.5px solid var(--border);border-radius:8px;overflow:hidden;margin-top:3rem}
.feat{background:var(--card);padding:2.25rem;position:relative;transition:background .22s;overflow:hidden}
.feat::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,rgba(201,130,10,.5),transparent);opacity:0;transition:opacity .22s}
.feat:hover{background:var(--card2)}
.feat:hover::before{opacity:1}
.feat-icon-wrap{width:44px;height:44px;background:rgba(201,130,10,.09);border:.5px solid rgba(201,130,10,.22);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:1.4rem}
.feat-icon-wrap i{font-size:24px;color:var(--gold)}
.feat h3{font-size:14.5px;font-weight:700;margin-bottom:.6rem;color:var(--text)}
.feat p{font-size:13px;color:var(--muted2);line-height:1.68}
.feat-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;margin-bottom:.75rem}
.badge-pro{background:rgba(201,130,10,.15);color:var(--gold);border:.5px solid rgba(201,130,10,.3)}
.badge-free{background:rgba(23,169,122,.1);color:var(--green);border:.5px solid rgba(23,169,122,.25)}

/* ── DASHBOARD ──────────────────────────────────── */
.dash-section{padding:100px 0;background:var(--bg);transition:background .25s}
.browser{background:var(--card);border:.5px solid var(--border2);border-radius:10px;overflow:hidden;margin-top:3rem;box-shadow:var(--shadow)}
.browser-bar{background:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:.5px solid var(--border)}
.b-dot{width:11px;height:11px;border-radius:50%}
.b-url{flex:1;background:var(--surface);border-radius:4px;padding:5px 14px;font-size:11px;color:var(--muted);margin:0 14px}
.browser-body{display:grid;grid-template-columns:180px 1fr;min-height:380px}
.db-sidebar{background:var(--bg);border-right:.5px solid var(--border);padding:1rem 0;display:flex;flex-direction:column;transition:background .25s}
.db-sidebar-logo{padding:.5rem 1rem 1rem;border-bottom:.5px solid var(--border);margin-bottom:.5rem}
.db-sidebar-logo .tree-icon{height:22px;width:auto}
[data-theme="dark"] .db-sidebar-logo .tree-icon{filter:brightness(0) invert(1)}
[data-theme="light"] .db-sidebar-logo .tree-icon{filter:brightness(0)}
.db-sidebar-logo .wordmark{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted2);text-transform:uppercase;margin-top:2px}
.db-nav-item{display:flex;align-items:center;gap:9px;padding:8px 1rem;font-size:11.5px;color:var(--muted2);cursor:pointer;transition:background .15s,color .15s;position:relative}
.db-nav-item:hover,.db-nav-item.active{background:rgba(201,130,10,.08);color:var(--text)}
.db-nav-item.active{border-right:2px solid var(--gold)}
.db-nav-item i{font-size:15px;color:var(--muted);width:16px;flex-shrink:0}
.db-nav-item.active i{color:var(--gold)}
.db-nav-sep{height:.5px;background:var(--border);margin:.5rem 0}
.db-live{margin-top:auto;padding:.75rem 1rem;font-size:10px;color:var(--muted);border-top:.5px solid var(--border)}
.db-main{padding:1.5rem;display:flex;flex-direction:column;gap:14px;overflow:hidden;background:var(--surface);transition:background .25s}
.db-top-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.db-metric{background:var(--bg);border:.5px solid var(--border);border-radius:6px;padding:12px 14px;transition:background .25s}
.db-metric .ml{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.db-metric .mv{font-size:19px;font-weight:700;margin-top:4px;color:var(--text)}
.db-metric .mc{font-size:10px;margin-top:2px}
.db-mid{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.db-chart-box,.db-smc-box{background:var(--bg);border:.5px solid var(--border);border-radius:6px;padding:12px 14px;transition:background .25s}
.db-chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.db-chart-title,.db-smc-title{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.db-smc-title{margin-bottom:10px}
.db-chart-tabs{display:flex;gap:4px}
.db-tab{font-size:9px;padding:3px 8px;border-radius:3px;color:var(--muted);border:.5px solid var(--border);background:none;cursor:pointer;font-family:'Inter',sans-serif}
.db-tab.active{background:rgba(201,130,10,.15);color:var(--gold);border-color:rgba(201,130,10,.3)}
.smc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:.5px solid var(--border);font-size:10.5px}
.smc-row:last-child{border-bottom:none}
.smc-label{color:var(--muted2)}
.smc-bull{color:var(--green);font-weight:600}
.smc-bear{color:var(--red);font-weight:600}
.db-signals-row{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.db-sig{background:var(--bg);border:.5px solid var(--border);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;transition:background .25s}
.db-sig-pair{font-size:9.5px;font-weight:700;color:var(--muted2);letter-spacing:.04em}
.db-sig-verdict{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;display:inline-block;margin-top:1px}
.v-buy{background:rgba(23,169,122,.15);color:var(--green)}
.v-sell{background:rgba(224,80,79,.15);color:var(--red)}
.v-hold{background:rgba(201,130,10,.12);color:var(--gold)}
.v-wait{background:rgba(114,112,106,.1);color:var(--muted2)}
.db-sig-conf{font-size:9px;color:var(--muted)}
.tab-panel{display:none}
.tab-panel.active{display:flex;flex-direction:column;gap:14px}
.pattern-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:.5px solid var(--border);border-radius:6px;padding:8px 12px;font-size:11px}
.p-sym{font-weight:700;color:var(--muted2);width:60px}
.p-name{color:var(--text);flex:1}
.p-bull{color:var(--green);font-weight:600;font-size:10px}
.p-bear{color:var(--red);font-weight:600;font-size:10px}
.p-conf{font-size:9px;padding:2px 7px;border-radius:3px;background:rgba(201,130,10,.12);color:var(--gold);font-weight:600}
.p-age{color:var(--muted);font-size:10px;width:50px;text-align:right}
.math-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.math-card{background:var(--bg);border:.5px solid var(--border);border-radius:6px;padding:10px 12px}
.math-card .mk{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.math-card .mv{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.math-card .ms{font-size:10px;color:var(--muted2);margin-top:2px}
.journal-row{display:grid;grid-template-columns:60px 60px 50px 1fr 50px 55px;gap:8px;font-size:11px;padding:7px 4px;border-bottom:.5px solid var(--border)}
.journal-row:last-child{border-bottom:none}
.journal-hdr{font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:0 4px}

/* ── PRICING ─────────────────────────────────────── */
.price-section{padding:100px 0;background:var(--surface);transition:background .25s}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:3.5rem;align-items:start}
.price-card{background:var(--card);border:.5px solid var(--border2);padding:2.25rem;border-radius:8px;position:relative;transition:transform .22s,box-shadow .22s,background .25s}
.price-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.15)}
.price-card.pro{border-color:var(--gold);border-width:1.5px;background:var(--card)}
[data-theme="dark"] .price-card.pro{background:linear-gradient(160deg,rgba(201,130,10,.06) 0%,var(--card) 60%)}
[data-theme="light"] .price-card.pro{background:linear-gradient(160deg,rgba(201,130,10,.04) 0%,var(--card) 60%)}
.pro-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:4px 16px;border-radius:20px;white-space:nowrap;letter-spacing:.08em}
.price-tier{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.price-amt{font-size:44px;font-weight:800;letter-spacing:-.04em;margin:.4rem 0;color:var(--text)}
.price-period{font-size:14px;font-weight:400;color:var(--muted2)}
.price-tagline{font-size:13px;color:var(--muted2);padding-bottom:1.4rem;border-bottom:.5px solid var(--border);margin-bottom:1.4rem;line-height:1.6}
.price-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:2rem}
.price-list li{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted2)}
.price-list li i{font-size:14px;flex-shrink:0;margin-top:1px}
.price-list li.on i{color:var(--green)}
.price-list li.off{opacity:.38}
.price-cta{display:block;width:100%;padding:12px;font-size:13.5px;font-weight:600;border-radius:6px;border:.5px solid var(--border2);background:transparent;color:var(--text);text-align:center;transition:all .18s}
.price-cta:hover{border-color:var(--gold);color:var(--gold)}
.price-cta.cta-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.price-cta.cta-gold:hover{background:var(--gold-lt)}
.price-note{text-align:center;font-size:12px;color:var(--muted);margin-top:1.5rem}

/* ── ABOUT ───────────────────────────────────────── */
.about-section{padding:100px 0;background:var(--bg);transition:background .25s}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center}
.about-text p{font-size:15px;color:var(--muted2);line-height:1.8;margin-bottom:1rem}
.about-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:.5px solid var(--border);border-radius:6px;overflow:hidden;margin-top:2.5rem}
.a-stat{background:var(--card);padding:1.5rem;text-align:center;transition:background .25s}
.a-stat .n{font-size:36px;font-weight:800;color:var(--gold)}
.a-stat .l{font-size:11.5px;color:var(--muted2);margin-top:4px}
.team-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}
.team-stack{display:flex;flex-direction:column;gap:12px}
.team-card{background:var(--card);border:.5px solid var(--border2);padding:1.1rem 1.25rem;border-radius:6px;display:flex;align-items:center;gap:14px;transition:border-color .18s,background .25s}
.team-card:hover{border-color:rgba(201,130,10,.4)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.av-gold{background:rgba(201,130,10,.15);border:.5px solid rgba(201,130,10,.35);color:var(--gold)}
.av-green{background:rgba(23,169,122,.13);border:.5px solid rgba(23,169,122,.3);color:var(--green)}
.av-purple{background:rgba(100,90,200,.13);border:.5px solid rgba(100,90,200,.3);color:#a09de8}
.tc-name{font-size:13.5px;font-weight:600;color:var(--text)}
.tc-role{font-size:12px;color:var(--muted2);margin-top:2px}

/* ── TESTIMONIALS ────────────────────────────────── */
.testi-section{padding:90px 0;background:var(--surface);transition:background .25s}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:3rem}
.testi{background:var(--card);border:.5px solid var(--border2);border-radius:8px;padding:1.75rem;transition:border-color .22s,background .25s}
.testi:hover{border-color:rgba(201,130,10,.35)}
.testi-stars{color:var(--gold);font-size:13px;margin-bottom:1rem;letter-spacing:2px}
.testi-text{font-size:13.5px;color:var(--muted2);line-height:1.72;margin-bottom:1.25rem;font-style:italic}
.testi-author{display:flex;align-items:center;gap:10px}
.testi-av{width:34px;height:34px;border-radius:50%;background:rgba(201,130,10,.12);border:.5px solid rgba(201,130,10,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.testi-name{font-size:13px;font-weight:600;color:var(--text)}
.testi-meta{font-size:11px;color:var(--muted)}

/* ── CONTACT ─────────────────────────────────────── */
.contact-section{padding:100px 0;background:var(--bg);transition:background .25s}
.contact-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:5rem}
.contact-info{display:flex;flex-direction:column;gap:1.25rem;margin-top:2.25rem}
.c-row{display:flex;align-items:flex-start;gap:14px}
.c-icon{width:40px;height:40px;background:rgba(201,130,10,.09);border:.5px solid rgba(201,130,10,.22);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:20px}
.c-label{font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.c-val{font-size:13.5px;color:var(--muted2)}
.contact-form{margin-top:2.25rem;display:flex;flex-direction:column;gap:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:.5px solid var(--border2);color:var(--text);padding:12px 14px;font-size:13px;border-radius:6px;font-family:'Inter',system-ui,sans-serif}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.field textarea{height:118px;resize:vertical;line-height:1.6}
.field select{color:var(--muted2)}

/* ── FOOTER ──────────────────────────────────────── */
footer{background:var(--surface);border-top:.5px solid var(--border);padding:4rem 2.5rem 2.5rem;transition:background .25s}
.footer-grid{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:3rem}
.footer-brand p{font-size:12.5px;color:var(--muted);line-height:1.7;max-width:220px}
.footer-col h5{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:1.1rem}
.footer-col a{display:block;font-size:13px;color:var(--muted2);margin-bottom:.6rem;transition:color .18s}
.footer-col a:hover{color:var(--gold)}
.footer-bottom{max-width:1160px;margin:2.5rem auto 0;border-top:.5px solid var(--border);padding-top:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem}
.footer-bottom span{font-size:11.5px;color:var(--muted);opacity:.65}

/* ── MOBILE NAV ──────────────────────────────────── */
#mob-nav{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:1.75rem;transition:background .25s}
#mob-nav.open{display:flex}
#mob-nav a{font-size:20px;font-weight:600;color:var(--muted2);transition:color .18s}
#mob-nav a:hover{color:var(--gold)}
.mob-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--muted2);font-size:24px;cursor:pointer}

/* ── RESPONSIVE ──────────────────────────────────── */
.nav-toggle-mobile{display:none}
.nav-toggle-desktop{display:flex}
@media(max-width:960px){
  .nav-links,.nav-badge,.btn-gold,.nav-login,.nav-toggle-desktop{display:none}
  .hamburger{display:block}
  .nav-toggle-mobile{display:flex}
  .how-steps{grid-template-columns:1fr 1fr}.step-arrow{display:none}
  .feat-grid{grid-template-columns:1fr 1fr}
  .browser-body{grid-template-columns:1fr}.db-sidebar{display:none}
  .db-top-row{grid-template-columns:1fr 1fr}
  .db-signals-row{grid-template-columns:repeat(4,1fr)}
  .db-mid{grid-template-columns:1fr}
  .price-grid{grid-template-columns:1fr 1fr}.about-grid,.contact-grid,.testi-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .hero-stats-bar{flex-wrap:wrap}
  .hero-stat{flex:1 0 40%;border-right:.5px solid var(--border2)}
}
@media(max-width:600px){
  .wrap{padding:0 1.25rem}
  .how-steps,.feat-grid{grid-template-columns:1fr}
  .math-grid{grid-template-columns:1fr}
  .db-signals-row{grid-template-columns:repeat(3,1fr)}
  .form-row{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .footer-bottom{flex-direction:column;text-align:center}
  .hero-bw-logo .tree-icon{height:56px}
  .hero-bw-logo .wordmark{font-size:28px}
}


/* Mobile: force solid backgrounds so light mode doesn't look grey */
@media(max-width:960px){
  #nav{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
  [data-theme="light"] #nav{background:#f8f7f2 !important;}
  [data-theme="dark"] #nav{background:#09090e !important;}
  [data-theme="light"] body,
  [data-theme="light"] .hero,
  [data-theme="light"] .how-section,
  [data-theme="light"] .dash-section,
  [data-theme="light"] .about-section,
  [data-theme="light"] .contact-section{background:#f8f7f2 !important;}
  [data-theme="light"] .feat-section,
  [data-theme="light"] .price-section,
  [data-theme="light"] .testi-section,
  [data-theme="light"] .ticker,
  [data-theme="light"] .trust-bar,
  [data-theme="light"] footer{background:#ffffff !important;}
}

</style>
</head>
<body>

  <div class="mob-bw-logo">

  <a href="#about" onclick="closeMob()">About</a>

<!-- NAV -->
<nav id="nav">
  <div class="wrap nav-inner">
    <a href="#" class="bw-logo">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAl4AAAIxCAYAAACcg7YJAAEAAElEQVR4nMT9d8AtSVUuDj/Vvfd+08lnZs5kwsCQkyIgAiqIglcxIHgJKqIiYCKIIioo3ouCyhVEERUYuN7rRYKAYEKSgkSBAYYwM0wOJ4c37[...]" alt="Blackwood Logo" class="tree-icon">
      <span class="wordmark">BLACKWOOD</span>
    </a>
    <div class="nav-links">
      <a href="#features">Features</a>
      <a href="#how">How it works</a>
      <a href="#assistant">MT5 Assistant</a>

      <button class="theme-toggle" onclick="toggleTheme()">
        <div class="toggle-track">
          <div class="toggle-knob">
            <span class="toggle-icon-night">🌙</span>
            <span class="toggle-icon-day">☀️</span>
          </div>
        </div>
      </button>
      <button class="hamburger" onclick="openMob()">☰</button>
    </div>
  </div>
</nav>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
}

function openMob() {
  document.getElementById('mob-nav').classList.add('open');
}

function closeMob() {
  document.getElementById('mob-nav').classList.remove('open');
}

// Initialize theme
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
</script>
