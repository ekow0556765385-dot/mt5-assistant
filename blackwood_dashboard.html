<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<!-- First script on purpose: an error thrown by anything loaded before
     this one is an error nobody hears about. -->
<script src="/bw-error-reporter.js" data-module="dashboard"></script>
<script src="/bw-source.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blackwood — Pro Dashboard</title>
<link rel="icon" href="https://blackwoodmt5.com/favicon.ico">
<link rel="icon" type="image/png" href="https://blackwoodmt5.com/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Defined BEFORE the icon <link> so the link's own onerror can call it.
   Detecting a blocked stylesheet after the fact is unreliable - Chromium
   still lists a failed sheet in document.styleSheets, and cssRules throws
   for any cross-origin sheet whether it loaded or not. The link's error
   event is the only deterministic signal. */
window.bwIconsFailed = function(){
  var MIRRORS = [
    'https://unpkg.com/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css',
    'https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.0.0/tabler-icons.min.css'
  ];
  var i = window.__bwIconMirror || 0;
  if(i >= MIRRORS.length){
    // Every source blocked: hide the empty glyph elements so the UI degrades
    // to clean text labels instead of a grid of blank squares.
    var st = document.createElement('style');
    st.textContent = 'i.ti:empty{display:none !important}';
    (document.head || document.documentElement).appendChild(st);
    return;
  }
  window.__bwIconMirror = i + 1;
  var l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = MIRRORS[i];
  l.onerror = window.bwIconsFailed;
  (document.head || document.documentElement).appendChild(l);
};
</script>
<!-- Icon CDN removed: the twelve icons this shell uses are inline SVG
     masks in the stylesheet below, so there is no font request left to
     fail. bwIconsFailed() above is left in place but can no longer be
     reached, and is stubbed immediately after this comment. -->
<script>window.__bwIconMirror = 99; window.bwIconsFailed = function(){};</script>

<style>
/* ─── DOMAIN CONFIG ─────────────────────────────────────────────────────────
   Change this ONE variable when you switch domains. Everything else updates.
   ─────────────────────────────────────────────────────────────────────────── */

/* ─── THEME ─────────────────────────────────────────────────────────────── */
:root,[data-theme="dark"]{
  --bg:#09090e;--surface:#0f0f16;--card:#14141c;
  --border:#22222e;--border2:#2e2e3e;
  --gold:#c9820a;--gold-lt:#e09b2a;
  --green:#17a97a;--red:#e0504f;
  --text:#eceae0;--muted:#72706a;--muted2:#9a9890;
  --nav-h:56px;--sidebar-w:220px;
  --nav-bg:#09090e;--sidebar-bg:#0b0b11;
}
[data-theme="light"]{
  --bg:#f8f7f2;--surface:#ffffff;--card:#f0ede6;
  --border:#d8d4cc;--border2:#c8c4bc;
  --gold:#c9820a;--gold-lt:#e09b2a;
  --green:#0f7a54;--red:#c03838;
  --text:#1a1814;--muted:#8a8678;--muted2:#6a6660;
  --nav-bg:#f8f7f2;--sidebar-bg:#f0ede6;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ─── TOP NAV ──────────────────────────────────────────────────────────── */
.topnav{height:var(--nav-h);background:var(--nav-bg);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:12px}
.bw-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.bw-logo img{height:30px;width:auto}
[data-theme="dark"] .bw-logo img{filter:brightness(0) invert(1)}
[data-theme="light"] .bw-logo img{filter:brightness(0)}
.bw-logo .wm{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.nav-divider{width:.5px;height:20px;background:var(--border2);margin:0 4px}
.nav-subtitle{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-badge{font-size:11px;color:var(--muted);border:.5px solid var(--border2);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;display:inline-block;flex-shrink:0}
.live-dot.off{background:var(--red);box-shadow:0 0 6px var(--red);animation:none}
.nav-badge.off{border-color:var(--red);color:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-user{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted2);border:.5px solid var(--border2);padding:4px 12px;border-radius:20px}
.nav-user i{font-size:14px;color:var(--muted)}
.nav-plan{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px}

/* Theme toggle */
/* ── DAY / NIGHT TOGGLE ──────────────────────────────────────────────
   Rebuilt, but the contract is unchanged: same element, same classes, same
   onclick, same [data-theme] hooks. Only the styling and the icons changed.

   Geometry is now derived from two variables instead of hard-coded pixels.
   Previously the knob was fixed at top:3px / 16px / translateX(20px) while
   the phone breakpoint grew the pill to 52x30 - so on mobile the knob sat
   above centre and stopped well short of the right edge, which is what made
   the pill look wrong. Now every measurement follows --tg-w / --tg-h, so
   resizing the pill cannot desynchronise the knob. */
.theme-toggle{
  --tg-w:46px; --tg-h:26px; --tg-pad:3px;
  --tg-knob:calc(var(--tg-h) - (var(--tg-pad) * 2));
  position:relative;width:var(--tg-w);height:var(--tg-h);
  border-radius:999px;border:.5px solid var(--border2);
  background:var(--card);cursor:pointer;flex-shrink:0;padding:0;
  display:inline-flex;align-items:center;
  transition:background .3s,border-color .3s,box-shadow .3s;
  -webkit-tap-highlight-color:transparent}
/* Invisible 44x44 hit area: Apple/Google minimum without enlarging the pill. */
.theme-toggle::after{content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:max(100%,44px);height:max(100%,44px)}
.theme-toggle:hover{border-color:var(--gold)}
.theme-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[data-theme="light"] .theme-toggle{background:rgba(201,130,10,.13);border-color:rgba(201,130,10,.35)}
.toggle-track{position:absolute;inset:0;border-radius:999px;overflow:hidden;pointer-events:none}
.toggle-knob{position:absolute;top:var(--tg-pad);left:var(--tg-pad);
  width:var(--tg-knob);height:var(--tg-knob);border-radius:50%;
  background:linear-gradient(160deg,#2b2b5e,#191970);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.45);
  /* Slight overshoot on the travel - it reads as a physical switch rather
     than a linear slide, and is the single biggest "modern" cue here. */
  transition:transform .34s cubic-bezier(.34,1.4,.64,1),background .3s,box-shadow .3s;
  will-change:transform}
[data-theme="light"] .toggle-knob{
  transform:translateX(calc(var(--tg-w) - var(--tg-knob) - (var(--tg-pad) * 2)));
  background:linear-gradient(160deg,var(--gold-lt,#e09b2a),var(--gold));
  box-shadow:0 1px 5px rgba(201,130,10,.55)}
.toggle-icon-night,.toggle-icon-day{position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;transition:opacity .25s,transform .25s}
.toggle-icon-night svg,.toggle-icon-day svg{
  width:calc(var(--tg-knob) * .62);height:calc(var(--tg-knob) * .62);display:block}
.toggle-icon-night{opacity:1;color:#dfe4ff}
.toggle-icon-day{opacity:0;transform:rotate(-90deg);color:#fff}
[data-theme="light"] .toggle-icon-night{opacity:0;transform:rotate(90deg)}
[data-theme="light"] .toggle-icon-day{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .toggle-knob,.toggle-icon-night,.toggle-icon-day{transition-duration:.01ms}
}

/* ─── LAYOUT ─────────────────────────────────────────────────────────────── */
.workspace{display:flex;flex:1;overflow:hidden}

/* ─── SIDEBAR ────────────────────────────────────────────────────────────── */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width .25s,transform .25s}
.sidebar-section{padding:.75rem 1rem .4rem;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:.25rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 1rem;font-size:12.5px;color:var(--muted2);cursor:pointer;transition:background .15s,color .15s;position:relative;border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif}
.nav-item:hover{background:rgba(201,130,10,.06);color:var(--text)}
.nav-item.active{background:rgba(201,130,10,.1);color:var(--text);border-right:2px solid var(--gold)}
.nav-item.active i{color:var(--gold)}
.nav-item i{font-size:16px;color:var(--muted);width:18px;flex-shrink:0}
.nav-item .item-badge{margin-left:auto;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:8px}
.badge-live{background:rgba(23,169,122,.15);color:var(--green)}
.badge-pro{background:rgba(201,130,10,.15);color:var(--gold)}

/* ── ATTENTION DOT ────────────────────────────────────────────────
   A dot, not a count: a number implies a queue of N things to clear,
   true of an inbox and false of a module that has a STATE. Amber =
   something new. Red = money exposed. Only red pulses — if everything
   pulses nothing reads as urgent. */
.nav-item .attn{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-left:auto;
  background:var(--gold);opacity:0;transform:scale(.4);
  transition:opacity .25s ease,transform .25s cubic-bezier(.34,1.56,.64,1)}
.nav-item .attn.on{opacity:1;transform:scale(1)}
.nav-item .attn.urgent{background:var(--red);box-shadow:0 0 7px rgba(224,80,79,.65)}
.nav-item .attn.urgent.on{animation:attnPulse 2s ease-in-out infinite}
@keyframes attnPulse{0%,100%{opacity:1}50%{opacity:.35}}
.nav-item .item-badge + .attn{margin-left:6px}
/* The pill was flush against the attention dot and the panel edge —
   `margin-left:auto` pushes it as far right as it will go. Pulling it
   back leaves the dot exactly where it was; the dot is positioned
   relative to the pill, not to the edge, so the spacing between them is
   unchanged and nothing in the dot system moves. */
/* THE LABEL WAS WRAPPING, not restyling. "Pattern Detector" and "Math
   Dashboard" are the two longest names in the sidebar, and the bare text
   node in this flex row is free to break mid-label — so clicking them
   showed "Pattern" over "Detector" and the row grew to two lines.
   nowrap keeps every label on one line; the badge and dot stop shrinking
   so they cannot be squeezed into the text; and the label is allowed to
   ellipsis if a name ever genuinely outgrows the sidebar rather than
   silently changing the row height. */
/* THE PILLS DID NOT LINE UP because the row is a flex line and the
   badge is pushed right by margin-left:auto. On a SHORT label there is
   spare space so it lands at the right edge; on a long one like
   "Pattern Detector" there is none left, so the badge sits immediately
   after the text — a different x on every row, which is what read as
   unprofessional.
   A grid fixes it properly: four columns, so the icon, the label, the
   pill and the dot each occupy the same x on every row regardless of
   how long the name is. */
.nav-item{white-space:nowrap;display:grid;
  /* Fixed widths for the last two columns, not auto: one nav row has no
     badge, and with auto its dot would slide left into the badge column
     and sit at a different x from every other row. Fixed keeps the
     columns reserved whether or not a row fills them. */
  grid-template-columns:18px 1fr 34px 8px;align-items:center;column-gap:8px}
.nav-item .item-badge{justify-self:end}
.nav-item .attn{justify-self:end}
.nav-item .item-badge{margin-left:0}
/* The label can shrink and ellipsis rather than shoving the pill. */
.nav-item{overflow:hidden}
.nav-item .item-badge,.nav-item .attn{flex-shrink:0}
.nav-item .item-badge{margin-right:8px}
@media (prefers-reduced-motion:reduce){.nav-item .attn.urgent.on{animation:none}}

.sidebar-sep{height:.5px;background:var(--border);margin:.5rem 0}
.sidebar-footer{padding:1rem;margin-top:auto;border-top:.5px solid var(--border)}
.sf-label{font-size:10px;color:var(--muted);margin-bottom:.4rem}
.sf-domain{font-size:11px;color:var(--muted2);font-family:monospace;word-break:break-all;line-height:1.5}

/* ─── CONTENT AREA ───────────────────────────────────────────────────────── */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* iframe url bar */
.url-bar{display:flex;align-items:center;gap:8px;padding:7px 1rem;background:var(--surface);border-bottom:.5px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0}
.url-dots{display:flex;gap:5px}
.url-dot{width:10px;height:10px;border-radius:50%}
.url-text{flex:1;background:var(--card);border-radius:4px;padding:4px 12px;font-family:monospace;font-size:11px;color:var(--muted2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.url-bar-actions{display:flex;gap:6px}
.url-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;transition:color .15s}
.url-btn:hover{color:var(--text)}

/* the iframe itself */
.tool-frame{flex:1;width:100%;border:none;background:var(--bg);transition:opacity .2s}
.tool-frame.loading{opacity:.4}

/* loading overlay */
.frame-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:10;pointer-events:none;opacity:0;transition:opacity .2s}
.frame-loader.show{opacity:1;pointer-events:all}
.spinner{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* The ring is a pseudo-element so ONLY it rotates — the logo inside stays
   perfectly still and upright. Rotating the container would spin the mark too. */
.spinner::before{content:'';position:absolute;inset:0;border:2px solid var(--border2);
  border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}
/* Single white silhouette recoloured per theme, exactly like the nav logo:
   brightness(0) makes it solid black, the extra invert flips it to white.
   One asset, both themes, always an exact match to the nav mark. */
.spinner-logo{width:58px;height:auto;display:block;opacity:.92;
  /* The mark has a ground shadow at its base, so its geometric centre sits
     below its optical centre. A 1px lift makes it read as truly centred. */
  transform:translateY(-1px);
  animation:logo-pulse 2.1s ease-in-out infinite}
[data-theme="dark"] .spinner-logo{filter:brightness(0) invert(1)}
[data-theme="light"] .spinner-logo{filter:brightness(0)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes logo-pulse{0%,100%{opacity:.55}50%{opacity:1}}
/* Respect the OS "reduce motion" setting — spinning + pulsing can trigger
   motion sickness and vestibular symptoms in some users. */
@media(prefers-reduced-motion:reduce){
  .spinner::before{animation-duration:2.4s}
  .spinner-logo{animation:none;opacity:.92}
}
.loader-label{font-size:12px;color:var(--muted2)}
.content-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ─── MOBILE SIDEBAR TOGGLE ─────────────────────────────────────────────── */
.mob-sidebar-btn{display:none;background:none;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
.sidebar-overlay.show{display:block}

/* ─── RESPONSIVE ─────────────────────────────────────────────────────────── */
/* Mobile browser chrome (the address bar that slides away) makes 100% /
   100vh taller than the actual visible area, so the bottom of the iframe
   was cut off and the last sidebar items were unreachable on phones.
   100dvh tracks the *visible* viewport; the 100vh line stays first as the
   fallback for browsers without dvh. */
html,body{height:100vh;height:100dvh}

/* Notch / home-indicator safe areas (iPhone X and later, landscape too). */
.topnav{padding-left:max(1.25rem,env(safe-area-inset-left));padding-right:max(1.25rem,env(safe-area-inset-right))}
.sidebar{padding-bottom:env(safe-area-inset-bottom)}

/* Tablets / iPad portrait (768-1024). The sidebar+content split left the
   tool iframe far too narrow here, so the sidebar collapses to a slide-over
   the same way it does on phones. iPad portrait is exactly 768px wide, and
   the old `max-width:768px` rule did fire there — but iPad landscape (1024)
   and most Android tablets fell through to the desktop layout. */
/* ── Mobile / tablet: sidebar becomes a tab strip ─────────────────────
   The sidebar was a slide-over drawer behind a hamburger. Switching module
   is THE thing you do in this dashboard, and hiding it behind a tap (plus a
   tap to close) made every switch a three-step action - with no visible clue
   the other modules exist. It becomes a horizontal, swipeable tab strip
   under the header instead: every module visible, one tap to switch, same
   pattern as the preview on the marketing site.
   Desktop keeps the vertical sidebar exactly as it was. */
@media(max-width:1024px){
  /* .workspace is the flex row holding sidebar + frame. It has to become a
     column, or the strip stretches to full height beside the iframe instead
     of sitting above it. */
  .workspace{flex-direction:column;min-height:0}
  .content-wrap{flex-direction:column}
  .sidebar{
    height:auto;align-self:stretch;
    position:static;width:100%;height:auto;transform:none;box-shadow:none;
    display:flex;flex-direction:row;align-items:center;
    overflow-x:auto;overflow-y:hidden;
    border-right:none;border-bottom:.5px solid var(--border);
    padding:.5rem .6rem;gap:5px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    scroll-snap-type:x proximity;flex-shrink:0}
  .sidebar::-webkit-scrollbar{display:none}
  /* Section labels ("Main", "Analysis"...) are vertical-list furniture and
     just eat horizontal room. */
  .sidebar-section{display:none}
  .nav-item{
    width:auto;flex:0 0 auto;white-space:nowrap;
    padding:8px 13px;border-radius:20px;
    border:.5px solid var(--border);background:var(--surface);
    font-size:12px;min-height:38px;gap:7px;scroll-snap-align:start}
  .nav-item.active{
    background:var(--gold);color:#000;border-color:var(--gold);
    border-right:none;font-weight:700}
  .nav-item.active i{color:#000}
  .nav-item i{font-size:15px;width:auto}
  /* Plan badges on a pill make it too wide to read at a glance. */
  .nav-item .item-badge{display:none}
  /* "Connected to <domain>" is a footer pinned to the bottom of a vertical
     column. In a horizontal strip it laid out as a 111px-tall block and made
     the whole strip three times taller than the pills inside it. The same
     information is already in the URL bar directly below. */
  .sidebar-footer{display:none}
  .sidebar-sep{display:none}
  /* No hamburger and no overlay any more - nothing left to slide over. */
  .mob-sidebar-btn{display:none !important}
  .sidebar-overlay{display:none !important}
}

/* Touch targets. 9px padding gave ~32px rows — below the 44px minimum both
   Apple and Google recommend, which is why menu taps were being missed. */
@media(hover:none),(pointer:coarse){
  /* Vertical sidebar only - the mobile pills set their own size above and
     would otherwise be re-inflated to full-width rows. */
  .sidebar:not([data-layout="strip"]) .nav-item{min-height:44px}
  .url-btn{padding:8px 10px;font-size:17px;min-width:40px;min-height:40px}
  .theme-toggle{--tg-w:52px;--tg-h:30px}
  .mob-sidebar-btn{font-size:24px;padding:8px;min-width:44px;min-height:44px}
}

/* Phones only. 767 not 768: iPad portrait is exactly 768px wide, and it has
   plenty of room for the nav badge and wordmark that these rules strip out —
   it only needs the collapsing sidebar from the 1024 block above. */
@media(max-width:767px){
  :root{--sidebar-w:min(280px,82vw);--nav-h:52px}
  .nav-user .user-name{display:none}
  .nav-subtitle{display:none}
  .nav-divider{display:none}
  /* The whole badge was hidden here, so a phone had no sign the server was
     unreachable. Keep the dot; show the words only when something is wrong. */
  .nav-badge{padding:5px 7px}
  .nav-badge #connText{display:none}
  .nav-badge.off #connText{display:inline}
  .bw-logo img{height:24px}
  .bw-logo .wm{font-size:12px}
  .url-dots{display:none}           /* decorative only — reclaim the width */
  .url-bar{padding:6px .75rem;gap:6px}
  .url-text{font-size:10px}
  .nav-right{gap:6px}

  /* iOS Safari does not give an iframe its own scroll context when the frame
     is absolutely positioned inside an overflow:hidden ancestor — the inner
     page renders at full height and simply gets clipped, with no way to
     scroll it. Giving the wrapper a touch scroll context fixes it. */
  .content-wrap{overflow:auto;-webkit-overflow-scrolling:touch}

  [data-theme="light"] body,[data-theme="light"] .topnav,[data-theme="light"] .sidebar,[data-theme="light"] .content,[data-theme="light"] .url-bar{background-color:unset}
  .topnav{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
  [data-theme="light"] .topnav{background:#f8f7f2 !important}
  [data-theme="dark"] .topnav{background:#09090e !important}

  /* FADED EDGES ON THE TOP BAR. The bar's .5px bottom border ate half a
     pixel of its height (43.5px), so every vertically-centred item — logo,
     user pill, connection pill, theme toggle — landed on a half pixel, and
     their own .5px outlines were smeared across two screen rows: one edge
     crisp, the other faded. The line is now drawn with a shadow (takes no
     height), the pills get a whole-pixel outline, and nothing is offset. */
  .topnav{border-bottom:none;box-shadow:inset 0 -1px 0 var(--border)}
  .nav-badge,.nav-user,.theme-toggle{border-width:1px}
  .nav-badge,.nav-user,.theme-toggle,.bw-logo{transform:translateZ(0)}
  /* even heights so centring lands on whole pixels */
  .nav-user{height:26px;box-sizing:border-box;padding-top:0;padding-bottom:0}
  .nav-plan{height:16px;line-height:1;padding-top:1px;padding-bottom:0;box-sizing:border-box;display:inline-flex;align-items:center}
}

/* Very small phones (iPhone SE and similar) */
@media(max-width:380px){
  .nav-plan{display:none}
  .url-bar-actions{gap:2px}
  .bw-logo .wm{display:none}
}

/* Landscape phones: the nav + url bar ate most of the short viewport. */
@media(max-height:500px) and (orientation:landscape){
  :root{--nav-h:44px}
  .url-bar{display:none}

/* ── Open-in-new-tab: desktop only ───────────────────────────────────
   This opens the module in a real browser tab, so the address bar shows
   the URL *including the one-time ?ticket=*. On a phone that is trivially
   copied and shared - the OS share sheet is one tap away and copies the
   full query string - which is how a module link ended up being passed
   around. On desktop the same URL exists but is far less likely to be
   shared out of an address bar, and it is genuinely useful there.
   The ticket itself is single-use with a 20s TTL, so a copied link is
   already dead on arrival; removing the button on mobile takes away the
   easy path to copying it at all. */
@media(max-width:1024px){
  .url-btn-external{display:none !important}
  /* The path readout is decorative - stop it being selectable so a long
     press offers "copy" on the module URL. */
  .url-text{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
}

/* ── ICONS WITHOUT A CDN ───────────────────────────────────────────
   The Tabler webfont was failing to load in production — the primary
   CDN, then both mirrors in bwIconsFailed(). When that happens every
   `ti ti-*` in the shell renders as an empty box, and the fallback
   simply HIDES them, so the sidebar loses its icons with no clue why.
   Each icon the shell actually uses is now an inline SVG mask. No
   network request, nothing to fail, and the glyph still inherits
   currentColor exactly as the font did. */

  background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;flex-shrink:0}

/* ── TRADING JOURNAL ─────────────────────────────────────────────── */
.jr-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;gap:.75rem;flex-wrap:wrap}
.jr-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.jr-actions select{max-width:100%;min-width:0}
.jr-tiles{grid-template-columns:repeat(6,minmax(0,1fr));gap:.6rem;margin-bottom:1rem}
.jr-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.jr-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.jr-table th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;background:var(--bg)}
.jr-table td{padding:8px 10px;font-size:13px;color:var(--muted2);border-bottom:1px solid var(--border2);white-space:nowrap}
.jr-table .n{text-align:right}
.jr-table td.n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.jr-table .sym,.jr-card .sym{color:var(--text);font-weight:600}
.jr-table .t{font-size:12px}
.jr-side{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;line-height:1.5}
.jr-side.buy{color:var(--green);background:rgba(23,169,122,.12)}
.jr-side.sell{color:var(--red);background:rgba(224,80,79,.12)}
.jr-cards{display:none}
@media(max-width:1024px){ .jr-tiles{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(max-width:640px){
  #journal-panel{padding:1rem !important}
  .jr-actions{width:100%}
  .jr-actions select{flex:1 1 100%}
  .jr-actions button{flex:1 1 0;justify-content:center;padding:8px 6px !important}
  .jr-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .jr-table{display:none}
  .jr-cards{display:flex;flex-direction:column;gap:.5rem}
  .jr-card{background:var(--card);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;font-variant-numeric:tabular-nums}
  .jr-c1{display:flex;align-items:center;gap:8px;font-size:13px}
  .jr-c1 b{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .jr-lots{color:var(--muted);font-size:12px}
  .jr-c2{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:11.5px;color:var(--muted2);flex-wrap:wrap}
  .jr-c2 span:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
}

<style>
/* Anchored overlay, not a layout row. The shell is a fixed 100dvh flex
   column with overflow:hidden, so anything inserted in the normal flow
   adds height the layout has no room for — which is what produced the
   scrollbar. position:fixed keeps the notice entirely out of the flow,
   so the dashboard beneath it does not move at all. */
#bw-notice{position:fixed;right:16px;bottom:16px;z-index:9999;
  max-width:min(420px,calc(100vw - 32px));
  padding:13px 15px;display:flex;gap:11px;align-items:flex-start;
  font-size:13.5px;line-height:1.5;border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.2),0 16px 40px -12px rgba(0,0,0,.55);
  animation:bwNoticeIn .26s cubic-bezier(.32,.72,0,1)}
@keyframes bwNoticeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#bw-notice .ic{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:12px;margin-top:1px}
#bw-notice .tx{flex:1;min-width:0;overflow-wrap:anywhere}
#bw-notice .cl{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;opacity:.6;
  padding:2px 5px;color:inherit;flex:0 0 auto}
#bw-notice .cl:hover{opacity:1}
#bw-notice.info{background:#1d3358;color:#dbe6ff}
#bw-notice.info .ic{background:#6d9bff;color:#08111f}
#bw-notice.warning{background:#4a3410;color:#ffe6b8}
#bw-notice.warning .ic{background:#f0b64c;color:#241a04}
#bw-notice.critical{background:#4d1a1a;color:#ffdcdc}
#bw-notice.critical .ic{background:#ff6b6a;color:#2a0a0a}
/* On phones the module fills the screen, so sit flush across the bottom
   above the safe area rather than floating in a corner. */
@media(max-width:640px){
  #bw-notice{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:none}
}
@media(prefers-reduced-motion:reduce){#bw-notice{animation:none}}
/* ═══ OFFLINE SCREEN (Oct 2026) ═══ shown in place of Chrome's dinosaur / Railway's error page */
.bw-off{--wm-filter:brightness(0) invert(1);--wm-op:.09;position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s,visibility 0s linear .35s}
[data-theme="light"] .bw-off{--wm-filter:brightness(0);--wm-op:.16}
.bw-off.show{opacity:1;pointer-events:all;visibility:visible;transition:opacity .35s}
.bw-off.full{position:fixed;z-index:9000}
.bw-off .bwo-wmk{position:absolute;inset:-160px;background-size:480px 480px;background-repeat:repeat;background-position:0 0;filter:var(--wm-filter);opacity:var(--wm-op);transform:rotate(-12deg);animation:bwoDrift 60s linear infinite;-webkit-mask-image:radial-gradient(ellipse at center,transparent 0,transparent 140px,#000 340px);mask-image:radial-gradient(ellipse at center,transparent 0,transparent 140px,#000 340px)}
@keyframes bwoDrift{to{background-position:480px 240px}}
.bw-off .bwo-glow{position:absolute;width:520px;height:520px;max-width:120vw;max-height:120vw;border-radius:50%;background:radial-gradient(circle,rgba(201,130,10,.13),transparent 65%);animation:bwoBreathe 5s ease-in-out infinite}
.bw-off.srv .bwo-glow{background:radial-gradient(circle,rgba(224,80,79,.11),transparent 65%)}
.bw-off.back .bwo-glow{background:radial-gradient(circle,rgba(23,169,122,.16),transparent 65%)}
@keyframes bwoBreathe{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.05);opacity:1}}
.bw-off .bwo-box{position:relative;text-align:center;max-width:420px;padding:0 20px;animation:bwoRise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes bwoRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bw-off .bwo-emblem{position:relative;width:120px;height:120px;margin:0 auto 26px;display:flex;align-items:center;justify-content:center}
.bw-off .bwo-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--gold);opacity:0;animation:bwoRipple 2.8s ease-out infinite}
.bw-off .bwo-ring:nth-child(2){animation-delay:.93s}
.bw-off .bwo-ring:nth-child(3){animation-delay:1.86s}
.bw-off.srv .bwo-ring{border-color:var(--red)}
.bw-off.back .bwo-ring{border-color:var(--green);animation-duration:1.2s}
@keyframes bwoRipple{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.bw-off .bwo-core{position:relative;width:84px;height:84px;border-radius:50%;background:var(--card);border:.5px solid var(--border2);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.bw-off .bwo-core img{width:50px;height:auto;transform:translateY(-1px);filter:var(--wm-filter);animation:bwoBob 3.2s ease-in-out infinite}
@keyframes bwoBob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(-5px)}}
.bw-off .bwo-badge{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#111;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);animation:bwoPop .5s .25s both cubic-bezier(.34,1.56,.64,1)}
.bw-off.srv .bwo-badge{background:var(--red);color:#fff}
.bw-off.back .bwo-badge{background:var(--green);color:#fff}
@keyframes bwoPop{from{transform:scale(0)}to{transform:scale(1)}}
.bw-off .bwo-badge svg{width:14px;height:14px}
.bw-off .bwo-kicker{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.bw-off.srv .bwo-kicker{color:var(--red)}
.bw-off.back .bwo-kicker{color:var(--green)}
.bw-off .bwo-title{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0 0 10px}
.bw-off .bwo-msg{font-size:13.5px;line-height:1.6;color:var(--muted2);margin:0 0 22px}
.bw-off .bwo-msg b{color:var(--text);font-weight:600}
.bw-off .bwo-pill{display:inline-flex;align-items:center;gap:10px;padding:9px 14px 9px 12px;border-radius:999px;background:var(--card);border:.5px solid var(--border2);font-size:12px;color:var(--muted2)}
.bw-off .bwo-dots{display:inline-flex;gap:3px}
.bw-off .bwo-dots i{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:bwoDot 1.2s ease-in-out infinite}
.bw-off .bwo-dots i:nth-child(2){animation-delay:.15s}.bw-off .bwo-dots i:nth-child(3){animation-delay:.3s}
.bw-off.srv .bwo-dots i{background:var(--red)}
.bw-off.back .bwo-dots i{background:var(--green)}
@keyframes bwoDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.bw-off .bwo-bar{width:64px;height:3px;border-radius:2px;background:var(--border2);overflow:hidden}
.bw-off .bwo-bar span{display:block;height:100%;width:0;background:var(--gold);transition:width 1s linear}
.bw-off.srv .bwo-bar span{background:var(--red)}
.bw-off.back .bwo-bar span{background:var(--green)}
.bw-off .bwo-actions{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:38px}
.bw-off .bwo-btn{font:600 12.5px 'Inter',system-ui,sans-serif;padding:9px 18px;border-radius:8px;border:.5px solid var(--gold);background:var(--gold);color:#111;cursor:pointer;transition:transform .15s,background .15s}
.bw-off .bwo-btn:hover{background:var(--gold-lt)}
.bw-off .bwo-btn:active{transform:scale(.97)}
.bw-off .bwo-foot{margin-top:22px;font-size:11px;color:var(--muted);line-height:1.5}
@media(max-width:700px){.bw-off .bwo-title{font-size:22px}}
@media(prefers-reduced-motion:reduce){.bw-off *{animation:none!important}.bw-off .bwo-ring{opacity:.35}}
</style>

/* ═══ SAFE DATE PARSING (Safari) ═════════════════════════════════════
   MT5 sends timestamps as "2026.08.09 14:22:08" (MQL5 TimeToString) and
   the API sometimes sends "2026-08-09 14:22:08". Chrome's parser accepts
   both; Safari's does NOT - it is strict about ISO 8601 and returns
   Invalid Date, so every derived value became NaN and rendered as a dash.
   That is why the dashboards worked in Chrome and showed nothing at all in
   Safari. Route every date through here instead of new Date(). */
function bwDate(v){
  if(v instanceof Date) return v;
  if(v === null || v === undefined || v === '') return new Date(NaN);
  if(typeof v === 'number') return new Date(v < 1e12 ? v * 1000 : v); // secs or ms
  var s = String(v).trim();
  if(/^\d+$/.test(s)){ var n = parseInt(s,10); return new Date(n < 1e12 ? n*1000 : n); }
  // 2026.08.09 -> 2026-08-09
  s = s.replace(/^(\d{4})\.(\d{2})\.(\d{2})/, '$1-$2-$3');
  // "YYYY-MM-DD HH:MM(:SS)" -> "YYYY-MM-DDTHH:MM(:SS)"  (Safari needs the T)
  s = s.replace(/^(\d{4}-\d{2}-\d{2})[ ]+(\d{2}:\d{2})/, '$1T$2');
  var d = new Date(s);
  if(!isNaN(+d)) return d;
  // Last resort: pull the numbers out and build it explicitly.
  var m = s.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  return new Date(NaN);
}

/* ═══ ON-SCREEN ERROR REPORTER ═══════════════════════════════════════
   Safari on iOS has no console you can read without a Mac and a cable, so
   a page that fails there is effectively silent. This prints the first few
   errors onto the page itself. It costs nothing when nothing is wrong, and
   turns "it doesn't load on Safari" into an actual message you can send.
   Add ?debug=1 to the dashboard URL to also see non-fatal detail. */
(function(){
  var shown = 0;
  function report(kind, msg, extra){
    if(shown >= 4) return;
    shown++;

// Change this one line when you move to a new domain. Nothing else to update.
/* Modules load from the SAME address the shell was opened at (on any
   blackwoodmt5.com host). A fixed app.blackwoodmt5.com meant a shell opened
   at blackwoodmt5.com/dashboard would frame modules from a different site:
   theme sync, alert dots (separate storage) and module-to-module links all
   fail silently across that boundary. Anywhere else (a file, a preview)
   falls back to the production address exactly as before. */
const BASE = (/^https:\/\/([a-z0-9-]+\.)*blackwoodmt5\.com$/i.test(location.origin))
  ? location.origin : 'https://app.blackwoodmt5.com';

// ── Auth token — carried forward into every iframe so the tool  ──
// routes underneath (which now also require Pro) don't block us.
// Token handling, in one place.
//
// It arrives as /dashboard?token=<JWT> from the account page. It must NOT
// stay in the address bar (that is what made module links shareable), but
// it also must survive a reload - bw-source.js reloads the page whenever
// the feed switcher changes, and mobile Safari reloads backgrounded tabs
// on its own. Stripping it without keeping a copy is what produced
// "Session missing" after any reload.
//
// So: take it from the URL if present, otherwise from this tab's storage,
// keep a copy, and only then clean the address bar.
// Set once the server has rejected our token, so a single expiry is
// reported once rather than once per module the user opens.
let bwSessionDead = false;
const DASH_TOKEN = (function(){
  var fromUrl = '';
  try { fromUrl = new URLSearchParams(window.location.search).get('token') || ''; } catch(e) {}
  var stored = '';
  try { stored = sessionStorage.getItem('bw-dash-token') || ''; } catch(e) {}
  var tok = fromUrl || stored;
  if (tok) { try { sessionStorage.setItem('bw-dash-token', tok); } catch(e) {} }
  return tok;
})();

/* ── THE TOOLS NEVER KNEW WHAT THEME THEY WERE IN ─────────────────
   Every tool ships light-mode CSS, but none of them reads `bw-theme` —
   the shell stored the choice and kept it to itself. So the sidebar
   could be light while Pattern Detector and the Math Dashboard rendered
   dark, and the whole look changed the moment you clicked one.
   The frames are same-origin, so the shell can set the attribute on
   them directly. That fixes it today without every tool having to grow
   its own listener, and a tool that later reads the key itself will
   simply agree. */
function applyThemeTo(frame){
  try{
    const t = document.documentElement.getAttribute('data-theme') || 'dark';
    const doc = frame && frame.contentDocument;
    if (doc && doc.documentElement) doc.documentElement.setAttribute('data-theme', t);
  }catch(e){ /* a cross-origin frame simply keeps its own theme */ }
}
/* Attached to window because the callers sit in a different script
   scope from this definition — the toggle threw ReferenceError without
   it, which my first check missed because boot alone did not exercise
   the toggle path. */
window.syncFrameTheme = syncFrameTheme;
window.applyThemeTo   = applyThemeTo;
function syncFrameTheme(){
  try{
    const f = document.querySelectorAll('#frame-container iframe');
    for (let i=0;i<f.length;i++) applyThemeTo(f[i]);
  }catch(e){}
}
  const saved = localStorage.getItem('bw-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  syncFrameTheme(saved);
  loadPath('/');
}

async function bwPanelOffline(path){
  let k = 'ok';

/* ═══ KEEP THE TOKEN OUT OF THE ADDRESS BAR ══════════════════════════
   account.html opens this page as /dashboard?token=<JWT>. The server
   exchanges it for a bw-session cookie on that first request, so the token
   in the URL is spent the moment the page loads - but it would otherwise
   sit in the address bar, in history, and in anything the user copies or
   shares. Remove it immediately; DASH_TOKEN already holds it in memory for
   minting per-module tickets. */
(function(){

   network-level filter is dropping cdn.jsdelivr.net, it is very likely

        'padding:9px 34px 9px 12px;border-top:1px solid #30363d;max-height:45vh;overflow:auto';

        'color:#8b949e;font-size:15px;padding:4px 8px;min-height:32px';
      x.onclick = function(){ box.remove(); };
      box.appendChild(x);

      .then(function(r){ line('API reachable (' + r.status + ')', r.ok); return r.ok; })

        line('  a content blocker, VPN or Private Relay is the usual cause', false);
      });

    // 2. Is the session actually accepted? This is the difference between
    //    "cannot connect" and "connected but logged out".
    if(!DASH_TOKEN){
      line('no session token in the dashboard URL', false);
    } else {
      fetch(BASE + '/api/me', { headers: { Authorization: 'Bearer ' + DASH_TOKEN } })
        .then(function(r){ line('session accepted (' + r.status + ')', r.ok); })
        .catch(function(e){ line('session check failed - ' + e.message, false); });
    }

    // 3. Is any EA actually sending? Empty here means the dashboards are
    //    right to show dashes - the problem is upstream in MT5.
    if(DASH_TOKEN){
      fetch(BASE + '/api/state', { headers: { Authorization: 'Bearer ' + DASH_TOKEN } })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if(!d) return line('no state returned', false);
          var wl = (d.watchlist || []).length;
          line('EA data: ' + wl + ' watchlist rows', wl > 0);
          if(!wl) line('  0 rows = the EA is not sending; check MT5, not the dashboard', false);
        })
        .catch(function(e){ line('state fetch failed - ' + e.message, false); });
    }
  }

  // Only when asked for, so it never appears for a normal user.
  if(new URLSearchParams(location.search).get('selftest') === '1'){
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
    else run();
  }
})();
/* ═══ MOBILE IFRAME BUDGET ═══════════════════════════════════════════
   Each module is a whole dashboard - its own polling, timers and sockets.
   Holding seven of them alive is fine on a desktop and far too much for a
   phone: the browser freezes or discards the background ones, the <iframe>
   element survives, and switching back showed a frozen shell with no data.
   On small screens keep only the active module (plus the one before it, so
   flicking back and forth stays instant) and drop the rest properly. */
const FRAME_STALE_MS  = 90 * 1000;   // background longer than this -> reload
const MAX_LIVE_FRAMES = 2;           // small screens only
const frameShownAt  = {};
const frameHiddenAt = {};

function IS_SMALL(){ return window.matchMedia('(max-width:1024px)').matches; }

function trimLiveFrames(keepPath){
  if(!IS_SMALL()) return;   // desktop keeps everything alive, as before
  const paths = Object.keys(frames)
    .filter(p => p !== keepPath)
    .sort((a,b) => (frameShownAt[b]||0) - (frameShownAt[a]||0)); // newest first
  paths.slice(MAX_LIVE_FRAMES - 1).forEach(p => {
    try { frames[p].remove(); } catch(e) {}
    delete frames[p];
    delete frameShownAt[p];
    delete frameHiddenAt[p];
  });
}

/* Coming back to the tab after the OS suspended it is the other way a
   module ends up alive-but-dead. Drop the background frames on resume so
   the next switch reloads cleanly. */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && IS_SMALL()){
    Object.keys(frames).forEach(p => {
      if(p !== currentPath){
        try { frames[p].remove(); } catch(e) {}
        delete frames[p]; delete frameShownAt[p]; delete frameHiddenAt[p];
      }
    });
  }
});

/* ═══ ALERT SCOUT (small screens) ════════════════════════════════════
   The sidebar dots are lit by alerts each module writes while it RUNS.
   On desktop every visited module stays alive, so they keep writing. On
   phones and tablets only two stay alive (the budget above), so a closed
   module could never light its dot — which is why the dots worked on a
   desktop and nowhere else.
   One closed module at a time is opened invisibly for 30 s, long enough
   to fetch and write its alert, then closed. Round robin, one a minute,
   only while the dashboard is on screen. Never more than one extra frame,
   so the memory budget still holds. */
const SCOUT_PATHS = ['/', '/smc-panel', '/arbiter', '/math', '/patterns'];
const SCOUT_EVERY_MS = 60 * 1000, SCOUT_LIFE_MS = 30 * 1000;
let scoutI = 0, scoutFrame = null;
async function scoutTick(){
  if (!IS_SMALL() || document.hidden || scoutFrame || bwSessionDead || !DASH_TOKEN) return;
  let path = null;
  for (let k = 0; k < SCOUT_PATHS.length; k++){
    const p = SCOUT_PATHS[(scoutI + k) % SCOUT_PATHS.length];
    if (!frames[p] && p !== currentPath && document.querySelector('.nav-item[data-path="' + p + '"]')){ path = p; scoutI += k + 1; break; }
  }
  if (!path) return;
  let url; try { url = await buildIframeUrl(path); } catch(e) { return; }
  if (frames[path] || currentPath === path || scoutFrame) return;   /* opened for real meanwhile */
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  f.style.cssText = 'position:fixed;left:-10000px;top:0;width:390px;height:700px;border:0;opacity:0;pointer-events:none';
  f.src = url;
  document.body.appendChild(f); scoutFrame = f;
  setTimeout(function(){ try { f.remove(); } catch(e){} if (scoutFrame === f) scoutFrame = null; }, SCOUT_LIFE_MS);
}
setTimeout(scoutTick, 8000);
setInterval(scoutTick, SCOUT_EVERY_MS);
document.addEventListener('visibilitychange', function(){
  if (document.hidden && scoutFrame){ try { scoutFrame.remove(); } catch(e){} scoutFrame = null; }
});

async function buildIframeUrl(path, info) {
  let url = BASE + path;
  info = info || {};
  /* No connection at all: do not even try — the offline screen takes over (see loadPath) */
  if (navigator.onLine === false) { info.fail = 'net'; return url; }
  if (!DASH_TOKEN) {
    // No token in the dashboard URL at all: every module will load
    // logged-out and show nothing. Say so once, rather than presenting
    // seven silently empty dashboards.
    bwDashWarn('Session missing \u2014 open the dashboard from your account page so your login is passed through.');
  }
  if (DASH_TOKEN && !bwSessionDead) {
    try {
      // One retry: a ticket is now the ONLY way a module can authenticate
      // (the shareable ?token= fallback was removed), so a single transient
      // network blip must not leave a module unopenable.
      let data = null;
      for (let attempt = 0; attempt < 2 && !(data && data.ticket); attempt++) {
        if (attempt) await new Promise(r => setTimeout(r, 400));
        const r = await fetch(BASE + '/api/ticket', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + DASH_TOKEN },
          cache: 'no-store'
        });
        if (r.ok) data = await r.json();
        else if (r.status >= 502 && r.status <= 504) { info.fail = 'srv'; break; }   /* Railway answering for a server that is down */
        else if (r.status === 401 || r.status === 403) {
          // The server has rejected this token: it will never work again.
          // Drop it so the next refresh does not repeat the same failure,
          // and mark it handled so the generic message below stays quiet.
          try { sessionStorage.removeItem('bw-dash-token'); } catch(e) {}
          bwSessionDead = true;
          bwDashWarn('Your session has expired. Open the dashboard again from your account page.');
          break;
        }
      }
      if (data && data.ticket) url += '?ticket=' + encodeURIComponent(data.ticket);
      // Only speak up if the expiry branch above has not already said it.
      // Both firing is what produced two stacked warnings for one failure.
      else if (!bwSessionDead && !info.fail) bwDashWarn('Could not verify your session for this module.');
    } catch (e) {
      // The raw-token fallback usually still works, but say so out loud - a
      // silent fallback is indistinguishable from "this module just has no
      // data", which is the hardest thing to report from a phone.
      // NO token fallback. Putting the raw JWT in a URL is what made module
      // links shareable - anyone could paste one into another browser and
      // get a working Pro session without paying. A failed ticket is now a
      // visible error instead of a quietly weaker credential.
      console.error('[DASH] ticket exchange failed', e);
      info.fail = 'down';   /* loadPath checks whether it is the connection or the server, and warns only if neither */
    }
  }
  return url;
}

// ── CROSS-MODULE NAVIGATION ────────────────────────────────────────
// Modules cannot navigate themselves: replacing an iframe's location
// leaves this sidebar pointing at the wrong tool, and window.top would
// reload the whole dashboard. They post a message instead:
//   { bw:'open', module:'assistant'|'brain'|..., view, pair, timeframe }
// Only same-origin messages are honoured.
const BW_MODULE_PATHS = {
  assistant:'/', brain:'/brain', smc:'/smc-panel', patterns:'/patterns',
  agent:'/agent', math:'/math', arbiter:'/arbiter'
};
/* ═══ KEEPING MODULES ALIVE (Oct 2026) ══════════════════════════════════
   1. "YOU ARE VISIBLE". A module kept alive in the background waits for its next timer when it is shown
      again — and the browser slows those timers right down while it is hidden, so it showed old data until
      a refresh. Now the shell tells the module the moment it is shown, or the tab comes back to the front,
      and the module updates at once.
   2. "MY LOGIN WAS REFUSED". When the server refuses a module (its login expired while it sat open), the
      module says so and the shell gets a fresh ticket and reloads JUST that module — no manual refresh. At
      most once a minute per module, so a real sign-out cannot loop. */
function bwTellShown(f){ try { if (f && f.contentWindow) f.contentWindow.postMessage({ bw:'shown' }, window.location.origin); } catch(e){} }
document.addEventListener('visibilitychange', function(){ if (!document.hidden) bwTellShown(frames[currentPath]); });
const bwRenewAt = {};
window.addEventListener('message', function(e){
  try {
    if (e.origin !== window.location.origin) return;
    const d = e.data;
    if (!d || d.bw !== 'renew') return;
    const path = Object.keys(frames).find(p => frames[p] && frames[p].contentWindow === e.source);
    if (!path || bwSessionDead) return;
    if (bwRenewAt[path] && Date.now() - bwRenewAt[path] < 60000) return;
    bwRenewAt[path] = Date.now();
    console.warn('[DASH] ' + path + ' reports its login was refused — reloading it with a fresh ticket');
    try { frames[path].remove(); } catch(err) {}
    delete frames[path]; delete frameShownAt[path]; delete frameHiddenAt[path];
    if (path === currentPath) loadPath(path);       /* a background module reloads when it is next opened */
  } catch(err) {}
});
window.addEventListener('message', function(e){
  try {
    if (e.origin !== window.location.origin) return;
    const d = e.data;
    if (!d || d.bw !== 'open') return;
    const path = BW_MODULE_PATHS[d.module];
    if (!path) return;
    // Remember what the module asked for so the target can pick it up.
    try {
      if (d.pair) sessionStorage.setItem('bw-open-pair', d.pair);
      if (d.view) sessionStorage.setItem('bw-open-view', d.view);
    } catch(err) {}
    // Move the sidebar highlight too. loadPath() switches the frame but only
    // loadTool() moved .active, so every message-driven open left the sidebar
    // pointing at the module the trader had just left.
    document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.path === path));
    loadPath(path);
  } catch(err) { console.warn('[DASH] module message ignored', err); }
});

/* ── ONE VIEW, ONE SPINNER (Oct 2026) ─────────────────────────────────
   Two bugs came from clicking while a module was still loading:
   · the spinner never cleared — landing on an already-open module showed
     it but never turned the spinner off, and the earlier load, now "not
     wanted", was not allowed to turn it off either;
   · the wrong dashboard showed in another module's place — a module asked
     for twice while loading got TWO iframes, only the newer was tracked,
     and the older one stayed visible over whatever was opened next.
   Now: a module loads once at a time, and after every change syncView()
   shows ONLY the selected module's frame and shows the spinner ONLY while
   that module is still loading. */
const loadingPaths = {};               /* path -> true while its ticket is being fetched */
const loadedFrames = new WeakSet();    /* iframes that have finished loading */
function syncView(){
  if (bwOffPath && currentPath !== bwOffPath) bwHideOffline();
  const box = document.getElementById('frame-container');
  const want = frames[currentPath] || null;
  if (box) Array.prototype.forEach.call(box.querySelectorAll('iframe'), f => {
    const show = (f === want);
    if (!show && f.style.display !== 'none') { const k = Object.keys(frames).find(p => frames[p] === f); if (k) frameHiddenAt[k] = Date.now(); }
    f.style.display = show ? 'block' : 'none';
  });
  const loader = document.getElementById('loader');
  if (loader) {
    const isModule = String(currentPath).charAt(0) === '/';
    const busy = isModule && (loadingPaths[currentPath] || (want && !loadedFrames.has(want)));
    loader.classList.toggle('show', !!busy);
  }
}

async function loadPath(path) {
  currentPath = path;
  if (bwOffPath && bwOffPath !== path) bwHideOffline();
  const name = TOOL_NAMES[path] || 'Dashboard';

  // The Journal and Telegram views hide the iframe container and show their
  // own panel in its place. Nothing ever put the container back, so after
  // visiting either of those, EVERY iframe module (MT5 Assistant, Brain,
  // SMC, Patterns, Math) opened to a blank screen until a full page reload.
  // Restore the container and hide the panels on every iframe module load.
  document.getElementById('frame-container').style.display = '';
  ['journal-panel', 'telegram-panel'].forEach(id => {
    const p = document.getElementById(id);
    if (p) p.style.display = 'none';
  });

  // Update URL bar — always clean, never shows a token or ticket
  document.getElementById('url-display').textContent = (BASE + path).replace('https://','');

  // Hide every other module's iframe (they stay alive in the background —
  // this is what keeps a Trading Brain verdict, or any other module's
  // state, intact when you switch away and back).
  Object.keys(frames).forEach(k => {
    if (frames[k].style.display !== 'none') frameHiddenAt[k] = Date.now();
    frames[k].style.display = 'none';
  });

  // Already loaded this module before.
  //
  // Desktop: show it as-is. Keeping every module alive is what preserves a
  // Trading Brain verdict (or any other module's state) across a switch.
  //
  // Mobile: NOT safe to assume it is still alive. Each module is a full
  // dashboard with its own timers and polling; phones freeze or discard
  // background iframes under memory pressure, and the element survives the
  // discard. Showing it without reloading then gives a frozen shell with no
  // data - which looks exactly like "the module stopped receiving data".
  // So on mobile, reload anything that has been in the background a while,
  // and keep only a couple alive at once (see trimLiveFrames below).
  if (frames[path]) {
    const f = frames[path];
    const hiddenFor = Date.now() - (frameHiddenAt[path] || Date.now());
    if (IS_SMALL() && hiddenFor > FRAME_STALE_MS) {
      // Force a genuine reload rather than trusting a possibly-dead context.
      f.remove();
      delete frames[path];
      delete frameHiddenAt[path];
    } else {
      f.style.display = 'block';
      frameShownAt[path] = Date.now();
      trimLiveFrames(path);
      syncView();
      bwTellShown(f);
      return;
    }
  }

  // First time opening this module — create its iframe and load it once.
  const loader = document.getElementById('loader');
  const loaderLabel = document.getElementById('loader-label');
  loader.classList.add('show');
  loaderLabel.textContent = 'Loading ' + name + '...';

  /* already being fetched (clicked again while loading): let that load finish
     and show itself — starting a second one is what left a stray copy behind */
  if (loadingPaths[path]) { syncView(); return; }
  loadingPaths[path] = true;
  let url;
  const bwInfo = {};
  try { url = await buildIframeUrl(path, bwInfo); }
  finally { delete loadingPaths[path]; }

  /* ── NO CONNECTION / SERVER DOWN ── loading the frame now would only show Chrome's dinosaur or
     Railway's error page in it. Show the Blackwood offline screen instead; it opens the module by
     itself once the server answers. */
  if (bwInfo.fail) {
    const k = (bwInfo.fail === 'down') ? await bwOffScreen().probe() : bwInfo.fail;
    if (k !== 'ok') {
      if (currentPath === path) bwShowOffline(path, k);
      syncView();
      return;
    }
    if (bwInfo.fail === 'down' && !bwSessionDead) bwDashWarn('Could not verify your session. Reload the page, or reopen the dashboard from your account.');
  }

  /* ── THE AWAIT IS A GAP, AND CLICKS HAPPEN IN IT ──────────────────
     buildIframeUrl() mints a one-time ticket over the network, so there
     is a real pause here — and nothing stopped the user clicking
     another module during it. Both calls then continued: the slower one
     appended its frame LAST, visible, over the module actually selected.
     That is the wrong dashboard showing under the right sidebar item,
     and it clears on refresh because the frame map is rebuilt.
     If the selection moved on while we were waiting, this load is stale.
     Its frame is still worth keeping — the module was asked for and the
     ticket is spent — but it must go in HIDDEN and not steal the view. */
  const stillWanted = (currentPath === path);

  const frame = document.createElement('iframe');
  /* Apply the shell's theme as soon as the tool has a document, and
     again on its load event — a frame can be swapped in before the
     first paint and would otherwise show its own default for a moment. */
  frame.addEventListener('load', function(){ applyThemeTo(frame); });
  /* If the licence was paused while this dashboard was open, the next
     module to load comes back as the server's "Dashboard paused" page —
     inside the frame, with the sidebar still around it, which looks like
     a broken module. Reload the whole shell instead: requirePlan then
     serves the pause page full screen, where it reads as what it is. */
  frame.addEventListener('load', function(){
    try {
      const t = frame.contentDocument && frame.contentDocument.title;
      if (t === 'Dashboard paused') location.reload();
    } catch (e) { /* cross-origin frame: not ours to read, and never a pause page */ }
  });
  frame.addEventListener('load', function(){
    let foreign = false;
    try { void frame.contentWindow.location.href; } catch (e) { foreign = true; }
    if (!foreign || BASE !== location.origin) return;
    bwOffScreen().probe().then(function(k){
      if (k === 'ok' || frames[path] !== frame) return;   /* server is fine: leave the frame alone */
      try { frame.remove(); } catch (e) {}
      delete frames[path];
      if (currentPath === path) bwShowOffline(path, k);
      syncView();
    });
  });
  frame.setAttribute('allow', 'fullscreen');
  frame.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);'
                      + (stillWanted ? '' : 'display:none;');
  /* A stale load must not clear the loader either — the module the user
     actually chose may still be loading behind it. */
  frame.onload = () => { loadedFrames.add(frame); syncView(); };
  frame.src = url;

  /* never two frames for one module: a stray copy is what showed through */
  if (frames[path] && frames[path] !== frame) { try { frames[path].remove(); } catch(e) {} }
  document.getElementById('frame-container').appendChild(frame);
  frames[path] = frame;
  if (stillWanted) frameShownAt[path] = Date.now();
  else             frameHiddenAt[path] = Date.now();
  trimLiveFrames(path);

  // Fallback hide loader after 8s (some pages don't fire onload reliably)
  setTimeout(() => { loadedFrames.add(frame); syncView(); }, 8000);
  syncView();
}

// Force a fresh reload of the CURRENT module only — everything else
// stays exactly as it was.
async function reloadFrame() {
  const path = currentPath;
  /* The Journal and Telegram pages are panels, not iframe modules —
     "reloading" them as a path loaded BASE + 'journal-status'. Refresh the
     panel's own data instead. */
  if (path === 'journal-status') { if (typeof loadJournalEntries === 'function') loadJournalEntries(); return; }

  if (old) { old.remove(); delete frames[path]; }
  await loadPath(path);
}

// ─── SYMBOL DISPLAY ───────────────────────────────────────────────────────
// Same guarded rule as the EAs and the server: only strip a broker suffix
// when what remains is a real pair, so PLATINUM / US30 stay intact.
const BW_CCY  = ['USD','EUR','GBP','JPY','CHF','AUD','NZD','CAD','SEK','NOK','DKK',
                 'SGD','HKD','ZAR','MXN','TRY','PLN','CZK','HUF','CNH','THB','INR'];
const BW_BASE = BW_CCY.concat(['XAU','XAG','XPT','XPD','BTC','ETH','LTC','XRP','SOL','BNB']);
function prettyPair(sym){
  if (!sym || sym === '—') return sym || '—';
  const up = String(sym).toUpperCase().replace(/[._-]/g,'');
  for (let cut=0; cut<=3 && up.length-cut>=6; cut++){
    const cand = up.slice(0, up.length-cut);
    if (cand.length!==6) continue;
    if (BW_BASE.includes(cand.slice(0,3)) && BW_CCY.includes(cand.slice(3,6))) return cand;
  }
  return up;
}

/* ══════════════════════════════════════════════════════════════════
   JOURNAL — a summary, and one spreadsheet across every account

   The journal listed eight raw columns for ONE account at a time and
   never added anything up. A prop trader running several funded accounts
   could see the rows but not the position: no net P/L, no win rate, and
   no way to get the record out of the browser.

   Two additions, no restyle:
     - a summary strip over the table, computed from the rows already
       fetched
     - a CSV covering EVERY account, with an `account` column so it can
       be filtered or pivoted once it is open
   ══════════════════════════════════════════════════════════════════ */

function journalStats(rows){
  const n = rows.length;
  const pl = rows.map(function(r){ return Number(r.profit) || 0; });
  const net = pl.reduce(function(a,b){ return a+b; }, 0);
  const wins = pl.filter(function(v){ return v > 0; }).length;
  const losses = pl.filter(function(v){ return v < 0; }).length;
  /* Scratches are counted separately rather than folded into losses —
     a break-even trade is not a loss, and lumping them in quietly
     depresses the win rate. */
  const flat = n - wins - losses;
  const decided = wins + losses;
  const grossWin  = pl.filter(function(v){ return v > 0; }).reduce(function(a,b){ return a+b; }, 0);
  const grossLoss = Math.abs(pl.filter(function(v){ return v < 0; }).reduce(function(a,b){ return a+b; }, 0));
  return {
    n: n, net: net, wins: wins, losses: losses, flat: flat,
    winRate: decided ? (wins / decided) * 100 : null,
    avgWin:  wins   ? grossWin  / wins   : 0,
    avgLoss: losses ? grossLoss / losses : 0,
    /* Profit factor is undefined with no losses at all — reporting it as
       infinity or as the gross win would both be misleading. */
    pf: grossLoss > 0 ? grossWin / grossLoss : null,
    best:  n ? Math.max.apply(null, pl) : 0,
    worst: n ? Math.min.apply(null, pl) : 0
  };
}

function renderJournalSummary(rows){
  const el = document.getElementById('journal-summary');
  if (!el) return;
  if (!rows || !rows.length) { el.style.display = 'none'; return; }
  const s = journalStats(rows);
  const money = function(v){
    return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
  };
  const tile = function(label, value, colour){
    return '<div style="min-width:0;background:var(--card);border:1px solid var(--border2);' +
           'border-radius:9px;padding:9px 12px">' +
           '<div style="font-size:17px;font-weight:700;font-family:ui-monospace,monospace;color:' + (colour||'var(--text)') + '">' +
           value + '</div>' +
           '<div style="font-size:10px;color:var(--muted);margin-top:1px">' + label + '</div></div>';
  };
  el.style.display = 'grid';
  el.className = 'jr-tiles';
  el.innerHTML =
    tile('net profit', money(s.net), s.net >= 0 ? 'var(--green)' : 'var(--red)') +
    tile('closed trades', String(s.n)) +
    tile('win rate', s.winRate == null ? '—' : s.winRate.toFixed(0) + '%') +
    tile('profit factor', s.pf == null ? '—' : s.pf.toFixed(2)) +
    tile('best trade', money(s.best), 'var(--green)') +
    tile('worst trade', money(s.worst), 'var(--red)');
}

/* ── THE SPREADSHEET ──────────────────────────────────────────────
   Every account in one file. The endpoint serves one account per call,
   so this walks the account list the dashboard already has rather than
   asking for a new backend route — nothing on the server has to change
   for this to work today. */
function csvCell(v){
  if (v === null || v === undefined) return '';
  const t = String(v);
  /* A symbol or comment containing a comma or a quote would otherwise
     shift every column after it, silently corrupting the sheet. */
  return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}

/* ── COLLECT ONCE, RENDER TWO WAYS ────────────────────────────────
   The CSV and the report need exactly the same data, and walking every
   account twice would double the requests and let the two outputs
   disagree if a trade closed between them. */
async function collectJournalAll(onProgress){
  const headers = {};
  if (DASH_TOKEN) headers.Authorization = 'Bearer ' + DASH_TOKEN;
  const first = await fetch(BASE + '/api/journal', { headers });
  if (!first.ok) throw new Error('HTTP ' + first.status);
  const head = await first.json();
  const accounts = (head.accounts && head.accounts.length)
    ? head.accounts.map(function(a){ return a.account_number; })
    : [head.accountNumber];
  const all = [], perAccount = [];
  for (let i = 0; i < accounts.length; i++) {
    const acct = accounts[i];
    if (onProgress) onProgress(i + 1, accounts.length);
    let rows = [];
    try {
      const r = await fetch(BASE + '/api/journal?account=' + encodeURIComponent(acct), { headers });
      if (r.ok) rows = (await r.json()).entries || [];
    } catch (e) { /* one unreachable account must not lose the others */ }
    rows.forEach(function(x){ all.push(Object.assign({ account: acct }, x)); });
    perAccount.push({ acct: acct, stats: journalStats(rows) });
  }
  all.sort(function(a,b){ return String(b.close_time||'').localeCompare(String(a.close_time||'')); });
  return { all: all, perAccount: perAccount, accounts: accounts };
}

async function reportJournalAll(btn){
  const lbl = document.getElementById('journal-report-lbl');
  const was = lbl ? lbl.textContent : '';
  if (btn) btn.disabled = true;
  /* The window has to be opened INSIDE the click, before any await —
     a popup opened after an await is not trusted by the browser and is
     blocked, which would look like the button doing nothing. */
  const win = window.open('', '_blank');
  if (win) win.document.write('<p style="font:14px system-ui;padding:24px;color:#444">Building your report…</p>');
  try {
    if (lbl) lbl.textContent = 'Collecting…';
    const d = await collectJournalAll(function(i,n){ if (lbl) lbl.textContent = 'Account ' + i + ' of ' + n + '…'; });
    if (!d.all.length) { if (win) win.close(); alert('No closed trades found on any account yet.'); return; }
    const o = journalStats(d.all);
    const esc = function(v){ return String(v==null?'':v).replace(/[&<>]/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; }); };
    const money = function(v){ return (v<0?'-$':'$') + Math.abs(v).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}); };
    const pos = function(v){ return v>=0 ? '#0d7a4f' : '#b4322f'; };
    const when = new Date().toISOString().replace('T',' ').slice(0,19);

    const tile = function(label,val,col){
      return '<div class="t"><div class="tv" style="color:'+(col||'#111')+'">'+val+'</div><div class="tk">'+label+'</div></div>'; };

    const acctRows = d.perAccount.map(function(p){
      return '<tr><td>#'+esc(p.acct)+'</td><td class="n">'+p.stats.n+'</td>'+
        '<td class="n" style="color:'+pos(p.stats.net)+'">'+money(p.stats.net)+'</td>'+
        '<td class="n">'+p.stats.wins+'</td><td class="n">'+p.stats.losses+'</td>'+
        '<td class="n">'+(p.stats.winRate==null?'—':p.stats.winRate.toFixed(0)+'%')+'</td>'+
        '<td class="n">'+(p.stats.pf==null?'—':p.stats.pf.toFixed(2))+'</td></tr>'; }).join('');

    /* THE REPORT DROPPED SEVEN COLUMNS THE SPREADSHEET CARRIED —
       ticket, stop, target, commission, swap, open time and comment.
       Someone reading the report was seeing a thinner record than
       someone reading the CSV, which makes the two disagree about what
       the account actually did. They are the same data; only the layout
       should differ. */
    const num = function(v){ return (v===null||v===undefined||v==='') ? '—' : esc(v); };
    const tradeRows = d.all.map(function(r){
      const pl = Number(r.profit)||0;
      const comm = Number(r.commission)||0, sw = Number(r.swap)||0;
      return '<tr><td class="d">'+esc(r.account)+'</td>'+
        '<td class="d">'+num(r.ticket)+'</td>'+
        '<td><b>'+esc(r.symbol)+'</b></td>'+
        '<td>'+esc(r.direction)+'</td><td class="n">'+num(r.volume)+'</td>'+
        '<td class="n">'+num(r.open_price)+'</td><td class="n">'+num(r.close_price)+'</td>'+
        '<td class="n">'+num(r.sl)+'</td><td class="n">'+num(r.tp)+'</td>'+
        '<td class="n">'+(comm?money(comm):'—')+'</td>'+
        '<td class="n">'+(sw?money(sw):'—')+'</td>'+
        '<td class="n" style="color:'+pos(pl)+'"><b>'+money(pl)+'</b></td>'+
        '<td class="d">'+esc(String(r.open_time||'').slice(0,16))+'</td>'+
        '<td class="d">'+esc(String(r.close_time||'').slice(0,16))+'</td>'+
        '<td class="d">'+esc(r.comment||'')+'</td></tr>'; }).join('');

    const html =

async function exportJournalAll(btn){
  const lbl = document.getElementById('journal-export-lbl');
  const was = lbl ? lbl.textContent : '';
  if (lbl) lbl.textContent = 'Collecting…';
  if (btn) btn.disabled = true;
  try {
    const d = await collectJournalAll(function(i,n){
      if (lbl) lbl.textContent = 'Account ' + i + ' of ' + n + '…';
    });
    const all = d.all, perAccount = d.perAccount, accounts = d.accounts;

    if (!all.length) { alert('No closed trades found on any account yet.'); return; }

    const money2 = function(v){ return (Math.round(v*100)/100).toFixed(2); };
    const overall = journalStats(all);
    const lines = [];

    /* A header block so the file reads as a report on its own, not just
       a dump someone has to summarise themselves. */
    lines.push('Blackwood Trading Journal');
    lines.push('Exported,' + new Date().toISOString().replace('T',' ').slice(0,19) + ' UTC');
    lines.push('Accounts,' + accounts.length);
    lines.push('');
    lines.push('SUMMARY — ALL ACCOUNTS');
    lines.push('Closed trades,' + overall.n);
    lines.push('Net profit,' + money2(overall.net));
    lines.push('Wins,' + overall.wins);
    lines.push('Losses,' + overall.losses);
    lines.push('Break-even,' + overall.flat);
    lines.push('Win rate %,' + (overall.winRate == null ? '' : overall.winRate.toFixed(1)));
    lines.push('Profit factor,' + (overall.pf == null ? '' : overall.pf.toFixed(2)));
    lines.push('Average win,' + money2(overall.avgWin));
    lines.push('Average loss,' + money2(overall.avgLoss));
    lines.push('Best trade,' + money2(overall.best));
    lines.push('Worst trade,' + money2(overall.worst));
    lines.push('');
    lines.push('PER ACCOUNT');
    lines.push('Account,Trades,Net profit,Wins,Losses,Win rate %,Profit factor');
    perAccount.forEach(function(p){
      lines.push([p.acct, p.stats.n, money2(p.stats.net), p.stats.wins, p.stats.losses,
        (p.stats.winRate == null ? '' : p.stats.winRate.toFixed(1)),
        (p.stats.pf == null ? '' : p.stats.pf.toFixed(2))].map(csvCell).join(','));
    });
    lines.push('');
    lines.push('EVERY CLOSED TRADE');

    const cols = ['account','ticket','symbol','direction','volume','open_price','close_price',
                  'sl','tp','profit','commission','swap','open_time','close_time','comment'];
    lines.push(cols.join(','));
    all.forEach(function(r){
      lines.push(cols.map(function(c){ return csvCell(r[c]); }).join(','));
    });

    /* BOM so Excel opens it as UTF-8 rather than mangling any non-ASCII
       symbol or comment. */
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'blackwood-journal-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    if (lbl) lbl.textContent = all.length + ' trades downloaded';
    setTimeout(function(){ if (lbl) lbl.textContent = was; }, 3200);
    return;
  } catch (e) {
    console.warn('[JOURNAL] export failed:', e && e.message);
    alert('Could not build the export: ' + (e && e.message ? e.message : 'unknown error'));
  } finally {
    if (btn) btn.disabled = false;
    if (lbl && lbl.textContent === 'Collecting…') lbl.textContent = was;
  }
}

async function loadJournalEntries(accountOverride) {
  const wrap = document.getElementById('journal-table-wrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="color:var(--muted2);font-size:13px;padding:2rem;text-align:center">Loading journal…</div>`;
  try {
    const headers = { };
    if (DASH_TOKEN) headers.Authorization = 'Bearer ' + DASH_TOKEN;
    let url = BASE + '/api/journal';
    if (accountOverride) url += '?account=' + encodeURIComponent(accountOverride);
    const res  = await fetch(url, { headers });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rows = data.entries || [];

    // Account label — shows which account is currently focused
    const label = document.getElementById('journal-account-label');
    if (label) {
      label.textContent = data.accountNumber ? `Account #${data.accountNumber}` : '';
    }

    // Account switcher — only shown once more than one account has traded
    const select = document.getElementById('journal-account-select');
    if (select) {
      if (data.accounts && data.accounts.length > 1) {
        select.style.display = 'inline-block';
        select.innerHTML = data.accounts.map(a =>
          `<option value="${a.account_number}" ${a.account_number === data.accountNumber ? 'selected' : ''}>Account #${a.account_number}${a.account_server ? ' — ' + a.account_server : ''}</option>`
        ).join('');
      } else {
        select.style.display = 'none';
      }
    }

    if (!rows.length) {
      wrap.innerHTML = `<div style="color:var(--muted2);font-size:13px;padding:2rem;text-align:center">
        No trades recorded yet. Closed trades from your EA will appear here automatically.</div>`;
      renderJournalSummary([]);
      return;
    }

    /* Formatted, aligned, and a card per trade on phones. The raw values
       were printed as-is (0.30000000000000004, 27.119999999999997),
       numbers were left-aligned so decimals never lined up, and on a
       phone the 8-column table was cut off with no sign it scrolled. */
    const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
    const digitsFor = sym => /JPY/.test(sym) ? 3 : /^XAU/.test(sym) ? 2 : /^XAG/.test(sym) ? 3 : /^(BTC|ETH)/.test(sym) ? 2 : 5;
    const fPrice = (v, sym) => { const n = num(v); return n == null ? '\u2014' : n.toFixed(digitsFor(sym)); };
    const fLots  = v => { const n = num(v); return n == null ? '\u2014' : n.toFixed(2); };
    const fMoney = v => { const n = num(v); return n == null ? '\u2014' : (n < 0 ? '-' : '+') + '$' + Math.abs(n).toFixed(2); };
    const fTime  = v => { if (v == null || v === '') return '\u2014'; const d = bwDate(v); if (!isFinite(+d)) return String(v);
      return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); };
    const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const view = rows.map(r => {
      const sym = prettyPair(r.symbol || '');
      const dir = String(r.direction || r.type || '').toLowerCase();
      const p = num(r.profit);
      return { sym: esc(sym || '\u2014'), dir: dir.indexOf('sell') >= 0 ? 'sell' : dir.indexOf('buy') >= 0 ? 'buy' : esc(dir || '\u2014'),
               lots: fLots(r.volume), op: fPrice(r.open_price, sym), cp: fPrice(r.close_price, sym),
               pl: fMoney(r.profit), plc: p == null ? 'var(--muted2)' : p >= 0 ? 'var(--green)' : 'var(--red)',
               ot: esc(fTime(r.open_time)), ct: esc(fTime(r.close_time)) };
    });
    const table = '<table class="jr-table"><thead><tr>' +
      '<th>Symbol</th><th>Side</th><th class="n">Lots</th><th class="n">Open</th><th class="n">Close</th>' +
      '<th class="n">Profit</th><th>Opened</th><th>Closed</th></tr></thead><tbody>' +
      view.map(v => '<tr><td class="sym">' + v.sym + '</td><td><span class="jr-side ' + v.dir + '">' + v.dir + '</span></td>' +
        '<td class="n">' + v.lots + '</td><td class="n">' + v.op + '</td><td class="n">' + v.cp + '</td>' +
        '<td class="n" style="color:' + v.plc + ';font-weight:600">' + v.pl + '</td>' +
        '<td class="t">' + v.ot + '</td><td class="t">' + v.ct + '</td></tr>').join('') + '</tbody></table>';
    const cards = '<div class="jr-cards">' + view.map(v =>
      '<div class="jr-card"><div class="jr-c1"><span class="sym">' + v.sym + '</span><span class="jr-side ' + v.dir + '">' + v.dir + '</span>' +
      '<span class="jr-lots">' + v.lots + ' lots</span><b style="color:' + v.plc + '">' + v.pl + '</b></div>' +
      '<div class="jr-c2"><span>' + v.op + ' \u2192 ' + v.cp + '</span><span>' + v.ot + ' \u2013 ' + v.ct + '</span></div></div>').join('') + '</div>';

    renderJournalSummary(rows);
    wrap.innerHTML = table + cards;
  } catch(e) {
    if (await bwPanelOffline('journal-status')) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `<div style="color:var(--red);font-size:13px;padding:2rem;text-align:center">Could not load journal: ${e.message}</div>`;
  }
}
