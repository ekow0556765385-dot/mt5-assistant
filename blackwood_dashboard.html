<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood — Pro Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
/* ─── DOMAIN CONFIG ─────────────────────────────────────────────────────────
   Change this ONE variable when you switch domains. Everything else updates.
   ─────────────────────────────────────────────────────────────────────────── */

/* ─── THEME ─────────────────────────────────────────────────────────────── */
:root,[data-theme="dark"]{
  --bg:#09090e;--surface:#0f0f16;--card:#14141c;
  --border:#22222e;--border2:#2e2e3e;
  --gold:#c9820a;--gold-lt:#e09b2a;
  --green:#17a97a;--red:#e0504f;
  --text:#eceae0;--muted:#72706a;--muted2:#9a9890;
  --nav-h:56px;--sidebar-w:220px;
  --nav-bg:#09090e;--sidebar-bg:#0b0b11;
}
[data-theme="light"]{
  --bg:#f8f7f2;--surface:#ffffff;--card:#f0ede6;
  --border:#d8d4cc;--border2:#c8c4bc;
  --gold:#c9820a;--gold-lt:#e09b2a;
  --green:#0f7a54;--red:#c03838;
  --text:#1a1814;--muted:#8a8678;--muted2:#6a6660;
  --nav-bg:#f8f7f2;--sidebar-bg:#f0ede6;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ─── TOP NAV ──────────────────────────────────────────────────────────── */
.topnav{height:var(--nav-h);background:var(--nav-bg);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:12px}
.bw-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.bw-logo img{height:30px;width:auto}
[data-theme="dark"] .bw-logo img{filter:brightness(0) invert(1)}
[data-theme="light"] .bw-logo img{filter:brightness(0)}
.bw-logo .wm{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.nav-divider{width:.5px;height:20px;background:var(--border2);margin:0 4px}
.nav-subtitle{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-badge{font-size:11px;color:var(--muted);border:.5px solid var(--border2);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;display:inline-block;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-user{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted2);border:.5px solid var(--border2);padding:4px 12px;border-radius:20px}
.nav-user i{font-size:14px;color:var(--muted)}
.nav-plan{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px}

/* Theme toggle */
.theme-toggle{position:relative;width:44px;height:24px;border-radius:12px;border:.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;transition:border-color .3s}
.theme-toggle:hover{border-color:var(--gold)}
.toggle-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#191970;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;transition:transform .3s cubic-bezier(.4,0,.2,1),background .3s;box-shadow:0 1px 6px rgba(25,25,112,.6)}
[data-theme="light"] .toggle-knob{transform:translateX(20px);background:var(--gold);box-shadow:0 1px 6px rgba(201,130,10,.5)}
.toggle-icon-night{font-size:10px;position:absolute;transition:opacity .2s}
.toggle-icon-day{font-size:10px;position:absolute;opacity:0;transition:opacity .2s}
[data-theme="light"] .toggle-icon-night{opacity:0}
[data-theme="light"] .toggle-icon-day{opacity:1}

/* ─── LAYOUT ─────────────────────────────────────────────────────────────── */
.workspace{display:flex;flex:1;overflow:hidden}

/* ─── SIDEBAR ────────────────────────────────────────────────────────────── */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width .25s,transform .25s}
.sidebar-section{padding:.75rem 1rem .4rem;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:.25rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 1rem;font-size:12.5px;color:var(--muted2);cursor:pointer;transition:background .15s,color .15s;position:relative;border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif}
.nav-item:hover{background:rgba(201,130,10,.06);color:var(--text)}
.nav-item.active{background:rgba(201,130,10,.1);color:var(--text);border-right:2px solid var(--gold)}
.nav-item.active i{color:var(--gold)}
.nav-item i{font-size:16px;color:var(--muted);width:18px;flex-shrink:0}
.nav-item .item-badge{margin-left:auto;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:8px}
.badge-live{background:rgba(23,169,122,.15);color:var(--green)}
.badge-pro{background:rgba(201,130,10,.15);color:var(--gold)}
.sidebar-sep{height:.5px;background:var(--border);margin:.5rem 0}
.sidebar-footer{padding:1rem;margin-top:auto;border-top:.5px solid var(--border)}
.sf-label{font-size:10px;color:var(--muted);margin-bottom:.4rem}
.sf-domain{font-size:11px;color:var(--muted2);font-family:monospace;word-break:break-all;line-height:1.5}

/* ─── CONTENT AREA ───────────────────────────────────────────────────────── */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* iframe url bar */
.url-bar{display:flex;align-items:center;gap:8px;padding:7px 1rem;background:var(--surface);border-bottom:.5px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0}
.url-dots{display:flex;gap:5px}
.url-dot{width:10px;height:10px;border-radius:50%}
.url-text{flex:1;background:var(--card);border-radius:4px;padding:4px 12px;font-family:monospace;font-size:11px;color:var(--muted2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.url-bar-actions{display:flex;gap:6px}
.url-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;transition:color .15s}
.url-btn:hover{color:var(--text)}

/* the iframe itself */
.tool-frame{flex:1;width:100%;border:none;background:var(--bg);transition:opacity .2s}
.tool-frame.loading{opacity:.4}

/* loading overlay */
.frame-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:10;pointer-events:none;opacity:0;transition:opacity .2s}
.frame-loader.show{opacity:1;pointer-events:all}
.spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-label{font-size:12px;color:var(--muted2)}
.content-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ─── MOBILE SIDEBAR TOGGLE ─────────────────────────────────────────────── */
.mob-sidebar-btn{display:none;background:none;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
.sidebar-overlay.show{display:block}

/* ─── RESPONSIVE ─────────────────────────────────────────────────────────── */
@media(max-width:768px){
  :root{--sidebar-w:240px}
  .sidebar{position:fixed;top:var(--nav-h);left:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .mob-sidebar-btn{display:block}
  .nav-user .user-name{display:none}
  .nav-subtitle{display:none}
  .nav-divider{display:none}
  [data-theme="light"] body,[data-theme="light"] .topnav,[data-theme="light"] .sidebar,[data-theme="light"] .content,[data-theme="light"] .url-bar{background-color:unset}
  .topnav{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
  [data-theme="light"] .topnav{background:#f8f7f2 !important}
  [data-theme="dark"] .topnav{background:#09090e !important}
}
</style>
</head>

// Change this one line when you move to a new domain. Nothing else to update.
const BASE = 'https://app.blackwoodmt5.com';

// ── Auth token — carried forward into every iframe so the tool  ──
// routes underneath (which now also require Pro) don't block us.
const DASH_TOKEN = new URLSearchParams(window.location.search).get('token') || '';

// ─── TOOL NAMES ──────────────────────────────────────────────────────────
const TOOL_NAMES = {
  '/':         'MT5 Assistant',
  '/brain':    'Trading Brain',
  '/smc-panel': 'SMC Panel',
  '/patterns': 'Pattern Detector',
  '/math':     'Math Dashboard',
};

// ─── STATE ────────────────────────────────────────────────────────────────
let currentPath = '/';

// ─── INIT ─────────────────────────────────────────────────────────────────
document.getElementById('domain-display').textContent = BASE.replace('https://','');

function init() {
  const saved = localStorage.getItem('bw-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  loadPath('/');
}

// ─── LOAD TOOL ────────────────────────────────────────────────────────────
function loadTool(el) {
  const path = el.dataset.path;
  // Update sidebar active state
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  loadPath(path);
  // Close mobile sidebar
  closeSidebar();
}

async function loadPath(path) {
  currentPath = path;
  const name = TOOL_NAMES[path] || 'Dashboard';

  // Update URL bar — always clean, never shows a token or ticket
  document.getElementById('url-display').textContent = (BASE + path).replace('https://','');

  // Show loader
  const loader = document.getElementById('loader');
  const loaderLabel = document.getElementById('loader-label');
  loader.classList.add('show');
  loaderLabel.textContent = 'Loading ' + name + '...';

  // Exchange the real token for a one-time, 20-second ticket before
  // building the iframe URL, so the token itself never touches the URL bar.
  let url = BASE + path;
  if (DASH_TOKEN) {
    try {
      const r = await fetch(BASE + '/api/ticket', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + DASH_TOKEN }
      });
      const data = await r.json();
      if (data.ticket) url += '?ticket=' + encodeURIComponent(data.ticket);
    } catch (e) {
      console.error('Ticket exchange failed, falling back to token', e);
      url += '?token=' + encodeURIComponent(DASH_TOKEN);
    }
  }

  // Load iframe
  const frame = document.getElementById('tool-frame');
  frame.classList.add('loading');
  frame.src = url;
  frame.onload = () => {
    frame.classList.remove('loading');
    loader.classList.remove('show');
  };
  // Fallback hide loader after 8s (some pages don't fire onload reliably)
  setTimeout(() => loader.classList.remove('show'), 8000);
}

async function reloadFrame() {
  await loadPath(currentPath);
}

async function openExternal() {
  let url = BASE + currentPath;
  if (DASH_TOKEN) {
    try {
      const r = await fetch(BASE + '/api/ticket', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + DASH_TOKEN }
      });
      const data = await r.json();
      if (data.ticket) url += '?ticket=' + encodeURIComponent(data.ticket);
    } catch (e) {
      console.error('Ticket exchange failed, falling back to token', e);
      url += '?token=' + encodeURIComponent(DASH_TOKEN);
    }
  }
  window.open(url, '_blank');
}

// ─── THEME ────────────────────────────────────────────────────────────────
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('bw-theme', next);
}

// ─── MOBILE SIDEBAR ───────────────────────────────────────────────────────
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

// ─── KEYBOARD SHORTCUT ────────────────────────────────────────────────────
// Ctrl/Cmd + number to switch tools quickly
const PATHS = ['/', '/brain', '/smc-panel', '/patterns', '/math'];
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key >= '1' && e.key <= '6') {
    e.preventDefault();
    const idx = parseInt(e.key) - 1;
    if (PATHS[idx]) {
      const btn = document.querySelector(`.nav-item[data-path="${PATHS[idx]}"]`);
      if (btn) loadTool(btn);
    }
  }
});

init();

// ── TRADING JOURNAL (live table from backend, no local server needed) ──
function loadJournalStatus(el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  closeSidebar();

  document.getElementById('url-display').textContent = BASE.replace('https://','') + '/api/journal';

  document.getElementById('tool-frame').style.display = 'none';
  const _tPanel = document.getElementById('telegram-panel');
  if (_tPanel) _tPanel.style.display = 'none';
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'journal-panel';
    panel.style.cssText = 'flex:1;display:flex;flex-direction:column;padding:1.5rem;overflow:auto;';
    document.querySelector('.content-wrap').appendChild(panel);
  }
  panel.style.display = 'flex';
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h2 style="font-size:16px;font-weight:700;color:var(--text)">Trading Journal</h2>
      <button onclick="loadJournalEntries()" style="background:var(--gold);color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">
        Refresh
      </button>
    </div>
    <div id="journal-table-wrap" style="flex:1;overflow:auto">
      <div style="color:var(--muted2);font-size:13px;padding:2rem;text-align:center">Loading journal…</div>
    </div>`;

  loadJournalEntries();
}

async function loadJournalEntries() {
  const wrap = document.getElementById('journal-table-wrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="color:var(--muted2);font-size:13px;padding:2rem;text-align:center">Loading journal…</div>`;
  try {
    const headers = { };
    if (DASH_TOKEN) headers.Authorization = 'Bearer ' + DASH_TOKEN;
    const res  = await fetch(BASE + '/api/journal', { headers });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rows = data.entries || [];

    if (!rows.length) {
      wrap.innerHTML = `<div style="color:var(--muted2);font-size:13px;padding:2rem;text-align:center">
        No trades recorded yet. Closed trades from your EA will appear here automatically.</div>`;
      return;
    }

    const cols = ['symbol','direction','volume','open_price','close_price','profit','open_time','close_time'];
    const th = cols.map(c => `<th style="text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border2)">${c.replace('_',' ')}</th>`).join('');
    const tr = rows.map(r => {
      const profitColor = (r.profit || 0) >= 0 ? 'var(--green)' : 'var(--red)';
      return `<tr>${cols.map(c => {
        let v = r[c] ?? '—';
        if (c === 'profit') return `<td style="padding:7px 10px;font-size:13px;color:${profitColor};border-bottom:1px solid var(--border2)">${v}</td>`;
        if ((c === 'open_time' || c === 'close_time') && v !== '—') v = new Date(v).toLocaleString();
        return `<td style="padding:7px 10px;font-size:13px;color:var(--muted2);border-bottom:1px solid var(--border2)">${v}</td>`;
      }).join('')}</tr>`;
    }).join('');

    wrap.innerHTML = `<table style="width:100%;border-collapse:collapse"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  } catch(e) {
    wrap.innerHTML = `<div style="color:var(--red);font-size:13px;padding:2rem;text-align:center">Could not load journal: ${e.message}</div>`;
  }
}

// ── TELEGRAM ALERTS (per-user connect flow) ─────────────────────
function loadTelegramConnect(el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  closeSidebar();

  document.getElementById('url-display').textContent = BASE.replace('https://','') + '/api/telegram/status';
  document.getElementById('tool-frame').style.display = 'none';
  const _jPanel = document.getElementById('journal-panel');
  if (_jPanel) _jPanel.style.display = 'none';
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'telegram-panel';
    panel.style.cssText = 'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;padding:2rem;';
    document.querySelector('.content-wrap').appendChild(panel);
  }
  panel.style.display = 'flex';
  panel.innerHTML = `<div style="color:var(--muted2);font-size:13px">Checking connection…</div>`;
  refreshTelegramStatus(panel);
}

async function refreshTelegramStatus(panel) {
  try {
    const headers = {};
    if (DASH_TOKEN) headers.Authorization = 'Bearer ' + DASH_TOKEN;
    const res  = await fetch(BASE + '/api/telegram/status', { headers });
    const data = await res.json();

    if (data.connected) {
      panel.innerHTML = `
        <div style="text-align:center;max-width:420px">
          <div style="font-size:36px;margin-bottom:.75rem">✅</div>
          <h2 style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:.5rem">Telegram Connected</h2>
          <p style="font-size:13px;color:var(--muted2);line-height:1.6">
            You're receiving pattern alerts, high-impact news alerts, and trade journal updates on your linked Telegram chat.
          </p>
        </div>`;
      return;
    }

    const linkRes  = await fetch(BASE + '/api/telegram/link', { headers });
    const linkData = await linkRes.json();

    panel.innerHTML = `
      <div style="text-align:center;max-width:420px">
        <div style="font-size:36px;margin-bottom:.75rem">📲</div>
        <h2 style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:.5rem">Connect Telegram</h2>
        <p style="font-size:13px;color:var(--muted2);line-height:1.6;margin-bottom:1.25rem">
          Get your own pattern alerts, news alerts, and trade journal updates sent directly to your Telegram.
        </p>
        <a href="${linkData.deepLink}" target="_blank" style="display:inline-block;background:var(--gold);color:#fff;text-decoration:none;padding:10px 24px;border-radius:6px;font-size:13px;font-weight:600">
          Open Telegram to Connect
        </a>
        <div style="margin-top:1rem">
          <button onclick="refreshTelegramStatus(document.getElementById('telegram-panel'))" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline">
            I've connected — refresh status
          </button>
        </div>
      </div>`;
  } catch(e) {
    panel.innerHTML = `<div style="color:var(--red);font-size:13px;padding:2rem;text-align:center">Could not load Telegram status: ${e.message}</div>`;
  }
}

// Show iframe again when switching away from journal or telegram panel
const _origLoadTool = loadTool;
loadTool = function(el) {
  const frame = document.getElementById('tool-frame');
  const jPanel = document.getElementById('journal-panel');
  const tPanel = document.getElementById('telegram-panel');
  if (jPanel) jPanel.style.display = 'none';
  if (tPanel) tPanel.style.display = 'none';
  frame.style.display = 'block';
  _origLoadTool(el);
};
</script>
</body>
</html>
