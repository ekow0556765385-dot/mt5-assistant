async function refreshTelegramStatus(panel) {
  try {
    const headers = {};
    if (DASH_TOKEN) headers.Authorization = 'Bearer ' + DASH_TOKEN;
    const res  = await fetch(BASE + '/api/telegram/status', { headers });
    /* A refused request used to fall through and build the Connect button
       from the error reply — its link was literally "undefined". */
    if (res.status === 401 || res.status === 403) {
      panel.innerHTML = '<div style="color:var(--muted2);font-size:13px;padding:2rem;text-align:center;max-width:420px">Your session has expired. Open the dashboard again from your account page to manage Telegram alerts.</div>';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (data.connected) {
      panel.innerHTML = `
        <div style="text-align:center;max-width:420px">
          <div style="font-size:36px;margin-bottom:.75rem">✅</div>
          <h2 style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:.5rem">Telegram Connected</h2>
          <p style="font-size:13px;color:var(--muted2);line-height:1.6">
            You're receiving pattern alerts, high-impact news alerts, and trade journal updates on your linked Telegram chat.
          </p>
        </div>`;
      return;
    }

    const linkRes  = await fetch(BASE + '/api/telegram/link', { headers });
    if (!linkRes.ok) throw new Error('HTTP ' + linkRes.status);
    const linkData = await linkRes.json();
    if (!linkData || !linkData.deepLink) throw new Error('no connect link returned');

    panel.innerHTML = `
      <div style="text-align:center;max-width:420px">
        <div style="font-size:36px;margin-bottom:.75rem">📲</div>
        <h2 style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:.5rem">Connect Telegram</h2>
        <p style="font-size:13px;color:var(--muted2);line-height:1.6;margin-bottom:1.25rem">
          Get your own pattern alerts, news alerts, and trade journal updates sent directly to your Telegram.
        </p>
        <a href="${linkData.deepLink}" target="_blank" style="display:inline-block;background:var(--gold);color:#fff;text-decoration:none;padding:10px 24px;border-radius:6px;font-size:13px;font-weight:600">
          Open Telegram to Connect
        </a>
        <div style="margin-top:1rem">
          <button onclick="refreshTelegramStatus(document.getElementById('telegram-panel'))" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline">
            I've connected — refresh status
          </button>
        </div>
      </div>`;
  } catch(e) {
    if (await bwPanelOffline('telegram-connect')) { panel.innerHTML = ''; return; }
    panel.innerHTML = `<div style="color:var(--red);font-size:13px;padding:2rem;text-align:center">Could not load Telegram status: ${e.message}</div>`;
  }
}

/* ═══ TAB STRIP (mobile / tablet) ════════════════════════════════════
   Below 1024px the sidebar renders as a horizontal strip. Two things it
   needs that a vertical list did not: the active pill has to be scrolled
   into view (otherwise switching by keyboard shortcut, or arriving on a
   module that sits off-screen right, leaves the strip showing the wrong
   part of itself), and any leftover drawer state has to be cleared. */
(function(){
  var sb = document.getElementById('sidebar');
  if(!sb) return;
  var mq = window.matchMedia('(max-width:1024px)');

  function isStrip(){ return mq.matches; }

  function sync(){
    // Drawer classes are meaningless in strip mode - drop them so a stale
    // .open cannot leave the sidebar translated off-screen.
    if(isStrip()){
      sb.classList.remove('open');
      var ov = document.getElementById('sidebar-overlay');
      if(ov) ov.classList.remove('show');
      sb.setAttribute('data-layout','strip');
    } else {
      sb.removeAttribute('data-layout');
    }
  }

  function scrollActiveIntoView(){
    if(!isStrip()) return;
    var active = sb.querySelector('.nav-item.active');
    if(!active) return;
    var left = active.offsetLeft - (sb.clientWidth - active.offsetWidth) / 2;
    sb.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
  }

  // Any click on a nav item, or any programmatic change of the active item,
  // should recentre the strip.
  sb.addEventListener('click', function(e){
    if(e.target.closest('.nav-item')) setTimeout(scrollActiveIntoView, 60);
  });
  new MutationObserver(function(){ scrollActiveIntoView(); })
    .observe(sb, { subtree:true, attributes:true, attributeFilter:['class'] });

  mq.addEventListener ? mq.addEventListener('change', sync) : mq.addListener(sync);
  sync();
  setTimeout(scrollActiveIntoView, 300);
})();
</script>
<script>
/* ── Usage heartbeat ───────────────────────────────────────────
   Beats every 30s, but ONLY while this tab is visible. Visibility is
   the whole point: a forgotten tab left open overnight would otherwise
   report eight hours of "usage" and make every number downstream
   fiction. Elapsed time is measured, not assumed, so a throttled
   background timer cannot inflate the count either. */
(function(){
  var BEAT_MS = 30000;
  var PATH_TO_MODULE = {
    '/':'assistant', '/brain':'brain', '/smc-panel':'smc', '/patterns':'patterns',
    '/agent':'agent', '/math':'math', '/retracement':'retracement', '/arbiter':'arbiter',
    'journal-status':'journal', 'telegram-connect':'telegram'
  };
  var lastBeat = Date.now();

  var beatDead = false;
  function token(){
    // The shell sets bwSessionDead once the server has rejected this
    // token. Beating on regardless would fire a 401 every 30 seconds for
    // as long as the tab stays open.
    try { if (typeof bwSessionDead !== 'undefined' && bwSessionDead) return null; } catch(e){}
    if (beatDead) return null;
    try { return (typeof DASH_TOKEN !== 'undefined' && DASH_TOKEN)
              || sessionStorage.getItem('bw-dash-token'); } catch(e){ return null; }
  }
  function base(){ try { return (typeof BASE !== 'undefined' && BASE) || ''; } catch(e){ return ''; } }
  function currentModule(){
    try { return PATH_TO_MODULE[typeof currentPath !== 'undefined' ? currentPath : '/'] || 'dashboard'; }
    catch(e){ return 'dashboard'; }
  }

  function beat(){
    if (document.visibilityState !== 'visible') { lastBeat = Date.now(); return; }
    var t = token(); if (!t) { lastBeat = Date.now(); return; }
    var elapsed = Math.round((Date.now() - lastBeat) / 1000);
    lastBeat = Date.now();
    if (elapsed <= 0) return;
    if (elapsed > 120) elapsed = 120;   // the server caps this too
    fetch(base() + '/api/usage/beat', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + t },
      body: JSON.stringify({ module: currentModule(), seconds: elapsed })
    }).then(function(r){
      // Stop after the first rejection rather than retrying forever.
      if (r && (r.status === 401 || r.status === 403)) beatDead = true;
    }).catch(function(){});
  }


/* ── CONNECTION STATE ────────────────────────────────────────────────
   "MT5 Connected" with a pulsing green dot was static markup — never
   touched by a single line of JavaScript. It said "connected" whether
   or not anything was, including with the network cable pulled out.

   This matters more in the shell than anywhere else: the shell is the
   container, so if it cannot reach the API then every module inside the
   iframe is dead too, and the trader is looking at frozen numbers with
   a green light telling them all is well.

   /api/quotes is public - no auth - so a failure here is purely network,
   never a session problem. Three things can make it stale and only one
   of them throws, so freshness is checked on a clock as well.
*/
(function(){
  var CONN = { lastOk: 0, stale: false };
  var PROBE_MS   = 20000;
  var STALE_AFTER = 70000;   /* ~3 missed probes */

  function paint(reason){
    var dot   = document.getElementById('connDot');
    var text  = document.getElementById('connText');
    var badge = document.getElementById('connBadge');
    if(!dot || !text || !badge) return;

    var offline = (navigator.onLine === false);
    var age     = CONN.lastOk ? (Date.now() - CONN.lastOk) : Infinity;
    var bad     = offline || CONN.stale || age > STALE_AFTER;

    if(!bad){
      dot.className   = 'live-dot';
      badge.className = 'nav-badge';
      text.textContent = 'MT5 Connected';
      badge.title = 'Live - last checked ' + new Date(CONN.lastOk).toLocaleTimeString();
      return;
    }
    /* Name WHICH failure it is: no internet and a server that is not
       answering call for different actions from the trader. */
    dot.className   = 'live-dot off';
    badge.className = 'nav-badge off';
    text.textContent = offline ? 'Offline' : 'Not connected';
    badge.title = (offline
        ? 'No internet connection.'
        : (reason || 'Cannot reach the Blackwood server.'))
      + (CONN.lastOk
          ? ' Last good connection ' + new Date(CONN.lastOk).toLocaleTimeString() + '.'
          : ' No connection has been made yet.');
  }

  /* BASE is declared in another script block. The surrounding code
     already guards it with a typeof check for exactly this reason;
     referencing it directly would throw a ReferenceError and kill the
     monitor silently, leaving the badge permanently green again. */
  function apiBase(){
    try { return (typeof BASE !== 'undefined' && BASE) || ''; } catch(e){ return ''; }
  }

  function probe(){
    if(navigator.onLine === false){ CONN.stale = true; paint(); return; }
    fetch(apiBase() + '/api/quotes', { cache:'no-store' })
      .then(function(r){
        if(r && r.ok){ CONN.lastOk = Date.now(); CONN.stale = false; paint(); }
        else { CONN.stale = true; paint('The server answered with an error (' + (r?r.status:'?') + ').'); }
      })
      .catch(function(){
        CONN.stale = true;
        paint('Cannot reach the server - a content blocker, VPN or Private Relay is the usual cause.');
      });
  }

  probe();
  setInterval(probe, PROBE_MS);
  /* A hung request never throws, so age is checked independently. */
  setInterval(function(){ paint(); }, 5000);
  window.addEventListener('offline', function(){ CONN.stale = true; paint(); });
  window.addEventListener('online',  function(){ probe(); });

  /* RECOVERY AFTER RECONNECT.
     The badge above already flips back to green on its own, but that was
     all that happened: the module iframe had failed to load while the
     connection was down, and nothing ever reloaded it. So the user came
     back to a live badge sitting above a dead panel and a stale warning
     strip, and the only way out was a manual refresh.

     Reload the CURRENT module only - background frames are left alone,
     exactly as reloadFrame() intends, and each is refreshed if and when
     it is opened.

     Deliberately does nothing when bwSessionDead is set: that flag means
     the server has actively REJECTED this session, which reconnecting
     cannot fix. Reloading then would replace an accurate "your session
     expired" message with a module that fails again for the same reason.

     Guarded so a flapping connection cannot queue a reload per event. */
  var recovering = false;
  window.addEventListener('online', function(){
    if (recovering) return;
    recovering = true;
    setTimeout(function(){
      recovering = false;
      try {
        if (typeof bwSessionDead !== 'undefined' && bwSessionDead) return;
        /* Confirm the server really is reachable before touching the UI -
           the browser's `online` event only means it has a network, not
           that our API answers. */
        fetch(apiBase() + '/api/quotes', { cache:'no-store' })
          .then(function(r){
            if (!r || !r.ok) return;
            var w = document.getElementById('bw-dash-warn');
            if (w) w.remove();
            if (typeof reloadFrame === 'function') reloadFrame();
          })
          .catch(function(){ /* still not really back - leave the strip up */ });
      } catch(e) { /* recovery must never throw into the page */ }
    }, 1200);   /* let the connection settle before the first request */
  });
})();

  setInterval(beat, BEAT_MS);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') lastBeat = Date.now();  // do not bill the time away
    else beat();                                                        // bank what was actually watched
  });
  // Leaving the page: bank the remainder. keepalive lets it survive unload.
  window.addEventListener('pagehide', function(){
    if (document.visibilityState !== 'visible') return;
    var t = token(); if (!t) return;
    var elapsed = Math.min(120, Math.round((Date.now() - lastBeat)/1000));
    if (elapsed <= 0) return;
    try {
      fetch(base() + '/api/usage/beat', {
        method:'POST', keepalive:true,
        headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + t },
        body: JSON.stringify({ module: currentModule(), seconds: elapsed })
      });
    } catch(e){}
  });
})();
</script>
<script>
/* ── In-app notices ────────────────────────────────────────────
   Polls /api/notices and shows at most ONE banner. Deliberately quiet:
   if the endpoint is missing or erroring, nothing renders and nothing
   is logged loudly — a notice system must never break the dashboard
   it sits above. */
(function(){
  var POLL_MS = 120000;
  function token(){
    try { return (typeof DASH_TOKEN !== 'undefined' && DASH_TOKEN)
              || sessionStorage.getItem('bw-dash-token'); } catch(e){ return null; }
  }
  function base(){
    try { return (typeof BASE !== 'undefined' && BASE) || ''; } catch(e){ return ''; }
  }
  function hide(){ var n=document.getElementById('bw-notice'); if(n) n.style.display='none'; }
  function show(m){
    var n=document.getElementById('bw-notice'); if(!n) return;
    n.className = m.severity;
    n.innerHTML = '<div class="ic">' + (m.severity==='info'?'i':'!') + '</div>'
                + '<div class="tx"></div>'
                + (m.dismissible ? '<button class="cl" aria-label="Dismiss">&#10005;</button>' : '');
    n.querySelector('.tx').textContent = m.body;   // textContent, never innerHTML
    n.style.display = 'flex';
    var b = n.querySelector('.cl');
    if (b) b.onclick = function(){
      hide();
      var t = token(); if (!t) return;
      fetch(base() + '/api/notices/' + m.id + '/dismiss',
        { method:'POST', headers:{ Authorization:'Bearer ' + t } }).catch(function(){});
    };
  }
  function check(){
    var t = token(); if (!t) return;
    fetch(base() + '/api/notices', { headers:{ Authorization:'Bearer ' + t } })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if (d && d.notices && d.notices.length) show(d.notices[0]); else hide(); })
      .catch(function(){});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', check);
  else check();
  setInterval(check, POLL_MS);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') check();
  });
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════
   ATTENTION DOTS

   THE FAULT IN THE FIRST BUILD: it shipped with no way to tell
   "working but quiet" from "broken". The only wired source lived in the
   module that is open by DEFAULT, and the dot is suppressed on the open
   module — so on a normal load nothing could ever light, and there was
   no readout to say so. Unverifiable by him, and undefendable by me.

   This build states its reasoning out loud. Every source reports what
   it read, what it decided and WHY, in the sidebar. And the test button
   lights all three states so the design can be SEEN.
   ══════════════════════════════════════════════════════════════════ */
(function(){
  const SEEN='bw-module-seen';
  const seen=(()=>{ try{ return JSON.parse(localStorage.getItem(SEEN)||'{}'); }catch(e){ return {}; } })();
  const save=()=>{ try{ localStorage.setItem(SEEN,JSON.stringify(seen)); }catch(e){} };
  const item=p=>document.querySelector('.nav-item[data-path="'+p+'"]');
  /* WHAT WAS SEEN, not just when. Every module rewrites its alert's time
     on each 5 s cycle even when nothing changed, so "newer than my last
     visit" was always true and a dot relit seconds after you looked. The
     shell now remembers WHAT the alert said when you opened the module and
     stays quiet until it says something different. Numbers are ignored in
     the comparison so "20 pips away" -> "19 pips away" is not "new". */
  const SEENSIG='bw-module-seen-sig';
  const seenSig=(()=>{ try{ return JSON.parse(localStorage.getItem(SEENSIG)||'{}'); }catch(e){ return {}; } })();
  const sigOf=r=>String(r.sig || (r.level+'|'+(r.why||''))).replace(/[\d.,]+/g,'#');
  const lastRead={};

  function paint(path,level){
    const it=item(path); if(!it) return;
    const d=it.querySelector('.attn'); if(!d) return;
    d.classList.toggle('urgent',level==='urgent');
    d.classList.toggle('on',level==='watch'||level==='urgent');
    d.title = level==='urgent'?'Needs your attention':level==='watch'?'Something new here':'';
  }
  function clear(path){
    seen[path]=Date.now(); save();
    const r=lastRead[path];
    if(r && r.level!=='clear'){ seenSig[path]=sigOf(r); try{ localStorage.setItem(SEENSIG,JSON.stringify(seenSig)); }catch(e){} }
    paint(path,'clear');
  }
  document.querySelectorAll('.nav-item[data-path]').forEach(b=>{
    b.addEventListener('click',()=>clear(b.dataset.path));
  });

  /* Each source returns {level, why} — `why` is shown in the panel, so a
     quiet dot always explains itself. */
  const SOURCES=[
    /* MT5 ASSISTANT — Risk Radar.
       Back on its own module. I had moved it to /patterns only because
       the Assistant is the default-open module and the dot is suppressed
       there; that was a workaround for a demo, not a design. It belongs
       where the feature lives, and it will light whenever the trader is
       looking somewhere else — which is the only time a dot matters. */
    { path:'/', label:'Risk Radar', read(){
        let r=null; try{ r=JSON.parse(localStorage.getItem('bw-risk-now')||'null'); }catch(e){}
        if(!r||!r.pairs) return {level:'clear', why:'no risk data written yet'};
        let worst=0, pair='';
        /* The Radar's own LEVEL, not its raw score — the level carries the
           Radar's persistence, so the dot cannot go red before the tab does. */
        const rank={standdown:2, elevated:1};
        let top=null;
        Object.entries(r.pairs).forEach(([k,p])=>{
          const lv=String(p.level||'').toLowerCase(), rk=rank[lv]||0;
          if((p.score||0)>worst){ worst=p.score||0; pair=k; }
          if(rk && (!top || rk>top.rk || (rk===top.rk && (p.score||0)>top.score))) top={k, rk, score:p.score||0, name:p.name||lv};
        });
        if(top&&top.rk===2) return {level:'urgent', at:r.t, why:top.k+' — stand down', sig:top.k+'|standdown'};
        if(top&&top.rk===1) return {level:'watch',  at:r.t, why:top.k+' — elevated',   sig:top.k+'|elevated'};
        return {level:'clear', why:'nothing elevated (highest '+pair+' at '+worst+')'};
      }},

    /* SMC PANEL — price returning to a zone. Published by the panel's own
       sweepFor(), so the dot and the tab share one verdict. */
    { path:'/smc-panel', label:'SMC Panel', read(){
        let a=null; try{ a=JSON.parse(localStorage.getItem('bw-smc-alert')||'null'); }catch(e){}
        return a&&a.t ? {level:a.urgent?'urgent':'watch', at:a.t, why:a.text||'zone in play'}
                      : {level:'clear', why:'no zone in play'};
      }},

    /* ARBITER — a CUT on an open trade, or a trade with no take profit
       (most of Arbiter's live judgement is measured against the TP).
       Published by arbiter.html as bw-arbiter-now; cleared when neither
       applies, so a quiet dot always means there is nothing to act on. */
    { path:'/arbiter', label:'Arbiter', read(){
        let a=null; try{ a=JSON.parse(localStorage.getItem('bw-arbiter-now')||'null'); }catch(e){}
        return a&&a.t ? {level:a.urgent?'urgent':'watch', at:a.t, why:a.text||'needs your attention'}
                      : {level:'clear', why:'no cut and every trade has a take profit'};
      }},

    /* TRADING MATH — Stop Radar. RED means a stop is within reach, which
       is money about to be lost. An unprotected position is a real
       problem but not an imminent one, so it is amber and does not
       compete with a stop that is actually about to be hit. */
    { path:'/math', label:'Stop Radar', read(){
        let a=null; try{ a=JSON.parse(localStorage.getItem('bw-math-alert')||'null'); }catch(e){}
        return a&&a.t ? {level:a.urgent?'urgent':'watch', at:a.t, why:a.text||'stop in reach'}
                      : {level:'clear', why:'no open position at risk'};
      }},

    /* PATTERN DETECTOR — slot reserved at his request; he is converting
       that feed from stale to live. The contract this reads:
         localStorage 'bw-pattern-alert' = {t, urgent, text}
           t       ms timestamp of the event (required — a dot only
                   counts as new if this postdates the last open)
           urgent  true = red, false/absent = amber
           text    one line for the panel, e.g. "EURUSD H&S confirmed"
       Write it when a pattern reaches a state worth interrupting for;
       delete the key when nothing qualifies. Until then this reads
       "not wired yet" rather than sitting mysteriously dark. */
    { path:'/patterns', label:'Patterns', read(){
        let a=null; try{ a=JSON.parse(localStorage.getItem('bw-pattern-alert')||'null'); }catch(e){}
        return a&&a.t ? {level:a.urgent?'urgent':'watch', at:a.t, why:a.text||'pattern event'}
                      : {level:'clear', why:'no breaking formation and no fresh H1+H4 agreement'};
      }}

    /* Trading Brain is deliberately absent: it reports on request rather
       than running live, so it has nothing to interrupt anyone about. */
  ];


  let testing=false;
  const ALERT_MAX_AGE=15*60*1000;
  function refresh(){
    if(testing) return;
    const active=document.querySelector('.nav-item.active');
    SOURCES.forEach(src=>{
      const r=src.read(); lastRead[src.path]=r;
      let level=r.level, note=r.why;
      /* A module that is no longer running never clears its last alert,
         so an old one would stay lit forever. Live modules rewrite theirs
         every few seconds and the scout every few minutes. */
      if(level!=='clear' && r.at && Date.now()-r.at > ALERT_MAX_AGE){ level='clear'; note='last alert is over 15 min old'; }
      /* A dot only counts as NEW if the event postdates the last time
         this module was opened AND says something you have not seen. */
      if(level!=='clear' && ((r.at && r.at<=(seen[src.path]||0)) || seenSig[src.path]===sigOf(r))){
        level='clear'; note='already seen';
      }
      if(level==='clear' && r.level==='clear' && seenSig[src.path]){   // the condition ended: forget it
        delete seenSig[src.path]; try{ localStorage.setItem(SEENSIG,JSON.stringify(seenSig)); }catch(e){}
      }
      /* The module you are looking at never carries a dot — but SAY so,
         instead of leaving it mysteriously dark. */
      if(active && active.dataset.path===src.path && level!=='clear'){
        /* You are looking at it right now, so it counts as seen — leaving
           the module must not light a dot for something already on screen. */
        seenSig[src.path]=sigOf(r); try{ localStorage.setItem(SEENSIG,JSON.stringify(seenSig)); }catch(e){}
        note='suppressed \u2014 you are in this module';
        level='clear';
      }
      paint(src.path, level);
    });
  }

  /* ── DIAGNOSTICS, OFF THE SCREEN ─────────────────────────────────
     The readout and the preview button were scaffolding: they existed so
     the dots could be VERIFIED rather than taken on trust, and leaving
     them in the sidebar turned a debugging aid into permanent furniture
     in a product that is otherwise quiet.
     They still exist — a feature that can be silent still has to be able
     to say why it is silent — but in the console, where they cost the
     trader nothing:
       BWAttn.status()   what every source read and decided, as a table
       BWAttn.preview()  lights one of each for eight seconds
  */
  window.BWAttn={
    status(){
      const active=document.querySelector('.nav-item.active');
      return SOURCES.map(src=>{
        const r=src.read();
        let level=r.level, note=r.why;
        if(level!=='clear' && ((r.at && r.at<=(seen[src.path]||0)) || seenSig[src.path]===sigOf(r))){ level='clear'; note='already seen'; }
        if(active && active.dataset.path===src.path && level!=='clear'){
          level='clear'; note='suppressed — you are in this module';
        }
        return {module:src.label, dot:level==='urgent'?'RED':level==='watch'?'amber':'off', why:note};
      });
    },
    preview(){
      if(testing) return 'already showing';
      testing=true;
      paint('/math','urgent'); paint('/smc-panel','watch'); paint('/','watch');
      setTimeout(function(){ testing=false; refresh(); },8000);
      return 'red on Trading Math, amber on SMC and Assistant — 8 seconds';
    }
  };

  refresh();
  setInterval(refresh,5000);
  window.addEventListener('storage',refresh);
})();
</script>
</body>
