<!DOCTYPE html>
<html lang="en">
<head>
<script src="/bw-source.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pattern Detector — Live Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0d14;color:#e0e0e8;font-size:13px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#13131e;border-bottom:1px solid #2a2a40}
.logo{font-size:14px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.status{font-size:11px;color:#6b7280}
.status.live{color:#22c55e}
.controls{display:flex;gap:8px;padding:10px 16px;background:#13131e;border-bottom:1px solid #2a2a40}
select,button{padding:5px 10px;border:1px solid #2a2a40;border-radius:6px;background:#1e1e30;color:#e0e0e8;font-size:12px;cursor:pointer}
button:hover{background:#2a2a40}
button.active{background:#185FA5;border-color:#185FA5;color:#fff}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px 16px}
.mc{background:#13131e;border:1px solid #2a2a40;border-radius:8px;padding:10px 12px}
.mc-lbl{font-size:10px;color:#6b7280;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.mc-val{font-size:18px;font-weight:600;color:#e0e0e8}
.main{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px;padding:0 16px 16px}
.panel{background:#13131e;border:1px solid #2a2a40;border-radius:10px;padding:12px}
.panel-title{font-size:10px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}

/* Pattern rows */
.pat-row{display:grid;grid-template-columns:1fr auto auto;align-items:start;gap:8px;padding:7px 0;border-bottom:1px solid #1e1e30}
.pat-row:last-child{border-bottom:none}
.pat-row.stale{opacity:0.5}
.pat-meta{display:flex;flex-direction:column;gap:3px}
.pat-name{font-size:12px;font-weight:500;color:#e0e0e8;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pat-time{font-size:10px;color:#6b7280}

/* Badges */
.badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.badge-bull{background:#14532d;color:#4ade80}
.badge-bear{background:#450a0a;color:#f87171}
.badge-neu{background:#1c1917;color:#a8a29e}
.badge-recent{background:#1e3a5f;color:#60a5fa}
.badge-new{background:#1a3a1a;color:#4ade80;animation:pulse 2s infinite}
.badge-stale{background:#2a2010;color:#a16207;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600}

/* Confidence bar */
.conf-wrap{display:flex;align-items:center;gap:5px;min-width:90px}
.conf-track{flex:1;height:5px;border-radius:3px;background:#1e1e30;overflow:hidden}
.conf-fill{height:100%;border-radius:3px}
.conf-pct{font-size:11px;font-weight:600;min-width:28px;text-align:right}

/* S/R zones */
.zone-row{display:flex;align-items:center;justify-content:space-between;padding:4px 7px;border-radius:5px;font-size:11px;margin-bottom:4px}
.z-support{background:#0f1e3a;border:1px solid #1e3a5f;color:#60a5fa}
.z-resist{background:#2d1a0f;border:1px solid #4a2010;color:#fb923c}

/* Signal rows */
.sig-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1e1e30;font-size:12px}
.sig-row:last-child{border-bottom:none}
.sl{color:#6b7280}
.sv-bull{color:#4ade80;font-weight:600}
.sv-bear{color:#f87171;font-weight:600}
.sv-neu{color:#a8a29e;font-weight:600}
.sig-bar-track{height:7px;border-radius:4px;background:#1e1e30;overflow:hidden;margin:8px 0 3px}
.sig-bar-fill{height:100%;border-radius:4px;transition:width .6s,background .6s}
.sig-bar-labels{display:flex;justify-content:space-between;font-size:9px;color:#4b5563}

/* Candle section */
.candle-section{margin-top:12px}
.candle-section .panel-title{margin-bottom:6px}
.candle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:5px;font-size:11px;margin-bottom:3px;border:1px solid transparent}
.candle-bull{background:#0a1f0e;border-color:#14532d;color:#4ade80}
.candle-bear{background:#1a0a0a;border-color:#450a0a;color:#f87171}
.candle-doji{background:#141420;border-color:#2a2a40;color:#a8a29e}
.candle-label{font-weight:600;font-size:10px}
.candle-prices{font-family:monospace;font-size:10px;color:#9ca3af}
.candle-age{font-size:9px;color:#6b7280}
.candle-badge-new{font-size:8px;padding:1px 5px;border-radius:3px;background:#1e3a5f;color:#60a5fa;font-weight:600}
.candle-trend-note{font-size:10px;color:#6b7280;margin-bottom:6px;padding:3px 6px;background:#1a1a28;border-radius:4px;border-left:2px solid #2a2a40}

/* Lists */
.plist{max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2a2a40 transparent}
.scroll{max-height:160px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2a2a40 transparent}
.empty{font-size:12px;color:#4b5563;padding:8px 0;text-align:center}
.last-update{font-size:10px;color:#4b5563;text-align:right;padding:4px 16px 10px}
.str-dots{display:flex;gap:2px}
.d{width:6px;height:6px;border-radius:50%;background:#2a2a40}
.d-bull{background:#4ade80}
.d-bear{background:#f87171}

/* Stale divider */
.stale-divider{font-size:9px;color:#4b5563;text-transform:uppercase;letter-spacing:.08em;padding:6px 0 3px;border-top:1px dashed #2a2a40;margin-top:4px}
/* ── Responsive: tablet ───────────────────────────────────────────
   Fixed 6-column metrics row and 3-column main layout above don't
   scale down on their own — this narrows the metrics grid first. */
@media (max-width:1024px){
  .metrics{grid-template-columns:repeat(3,1fr);}
}

/* ── Responsive: mobile ───────────────────────────────────────────
   Below this width, 3 fixed panels side-by-side leave no real room
   for any of them. Stack into one column instead; the page already
   scrolls normally (no overflow:hidden lock here), so stacking just
   makes it a longer page rather than a broken one. */
@media (max-width:820px){
  .metrics{grid-template-columns:repeat(2,1fr);}
  .main{grid-template-columns:1fr;}
  .controls{flex-wrap:wrap;}
  select,button{padding:8px 12px;font-size:13px;} /* bigger touch targets */
  .pat-row{grid-template-columns:1fr auto;row-gap:4px;}
}

@media (max-width:480px){
  .metrics{grid-template-columns:repeat(2,1fr);}
  .mc-val{font-size:15px;}
  body{font-size:12px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span class="dot"></span>
    Pattern Detector — Live Dashboard
  </div>
  <span class="status" id="connStatus">Connecting...</span>
</div>

<div class="controls" style="flex-wrap:wrap;justify-content:space-between">
  <!-- Matches the default WatchPairs list on the EA — update this if you change it there -->
  <div style="display:flex;gap:6px;flex-wrap:wrap" id="pairTabs">
    <button class="active" data-sym="EURUSD" onclick="selectPair('EURUSD',this)">EUR/USD</button>
    <button data-sym="GBPUSD" onclick="selectPair('GBPUSD',this)">GBP/USD</button>
    <button data-sym="USDJPY" onclick="selectPair('USDJPY',this)">USD/JPY</button>
    <button data-sym="XAUUSD" onclick="selectPair('XAUUSD',this)">XAU/USD</button>
    <button data-sym="USDCHF" onclick="selectPair('USDCHF',this)">USD/CHF</button>
    <button data-sym="GBPJPY" onclick="selectPair('GBPJPY',this)">GBP/JPY</button>
  </div>
  <div style="display:flex;gap:4px" id="tfToggle">
    <button class="active" data-tf="H1" onclick="selectTF('H1',this)">H1</button>
    <button data-tf="H4" onclick="selectTF('H4',this)">H4</button>
  </div>
</div>
<div style="padding:0 16px 4px;font-size:11px;color:#6b7280">
  Auto-refreshes every 5s when MT5 EA is running
</div>

<div class="metrics" id="metrics">
  <div class="mc"><div class="mc-lbl">Symbol</div><div class="mc-val" id="m-sym">—</div></div>
  <div class="mc"><div class="mc-lbl">Price</div><div class="mc-val" id="m-price">—</div></div>
  <div class="mc"><div class="mc-lbl">Bias</div><div class="mc-val" id="m-bias">—</div></div>
  <div class="mc"><div class="mc-lbl">Score</div><div class="mc-val" id="m-score">—</div></div>
  <div class="mc"><div class="mc-lbl">RSI</div><div class="mc-val" id="m-rsi">—</div></div>
  <div class="mc"><div class="mc-lbl">EMA bias</div><div class="mc-val" id="m-ema">—</div></div>
</div>

<div class="main">

  <!-- LEFT: Patterns -->
  <div class="panel">
    <div class="panel-title">Detected patterns <span id="patCount" style="color:#4b5563"></span></div>
    <div class="plist" id="patList"><div class="empty">Waiting for MT5 data...</div></div>
  </div>

  <!-- MIDDLE: S/R + Candles -->
  <div class="panel">
    <div class="panel-title">Support / Resistance</div>
    <div class="scroll" id="srList"><div class="empty">—</div></div>

    <div class="candle-section">
      <div class="panel-title">Recent candles <span id="candleBiasLabel" style="color:#6b7280;font-size:9px;font-weight:400;margin-left:4px"></span></div>
      <div id="candleTrendNote" class="candle-trend-note" style="display:none"></div>
      <div id="candleList"><div class="empty">—</div></div>
    </div>
  </div>

  <!-- RIGHT: Composite signal -->
  <div class="panel">
    <div class="panel-title">Composite signal</div>
    <div id="sigRows"><div class="empty">—</div></div>
    <div class="sig-bar-track"><div class="sig-bar-fill" id="sigBar" style="width:50%"></div></div>
    <div class="sig-bar-labels"><span>Bearish</span><span>Neutral</span><span>Bullish</span></div>
  </div>

</div>
<div class="last-update" id="lastUpdate"></div>

<script>
const BASE = window.location.origin;
let lastTimestamp = null; // track when last data arrived

function confColor(c) {
  return c >= 75 ? '#4ade80' : c >= 60 ? '#fb923c' : '#f87171';
}

// ── Time-ago helper ──────────────────────────────────────────────────────────
// We measure age by bar_index (bars ago from the current bar).
// bar_index 0 = current bar, 1 = one bar ago, etc.
// We also track the wall-clock time when data was received so we can show
// "just now" for the very newest data push.
let dataReceivedAt = null;

function barAgoLabel(barIndex) {
  if (barIndex === 0) return 'Just now';
  if (barIndex === 1) return '1 bar ago';
  if (barIndex <= 3) return `${barIndex} bars ago`;
  if (barIndex <= 10) return `${barIndex} bars ago`;
  return `${barIndex} bars ago`;
}

function wallClockAge() {
  if (!dataReceivedAt) return '';
  const secs = Math.floor((Date.now() - dataReceivedAt) / 1000);
  if (secs < 10) return 'just now';
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  return `${Math.floor(mins/60)}h ago`;
}

// ── Classify a pattern as recent / mid / stale ───────────────────────────────
// recent = bar_index 0–2  → "Just now" / "N bars ago" + blue badge
// mid    = bar_index 3–8  → no extra badge, normal opacity
// stale  = bar_index 9+   → amber STALE badge, dimmed
function ageClass(barIndex) {
  if (barIndex <= 2) return 'recent';
  if (barIndex <= 8) return 'mid';
  return 'stale';
}

let activePairSym = 'EURUSD'; // matches the initially-active button above
let activeTF       = 'H1';

function selectPair(sym, btn){
  activePairSym = sym;
  document.querySelectorAll('#pairTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  fetchData();
}

function selectTF(tf, btn){
  activeTF = tf;
  document.querySelectorAll('#tfToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  fetchData();
}

// ── Main fetch ────────────────────────────────────────────────────────────────
async function fetchData() {
  try {
    const url = BASE + '/api/patterns?symbol=' + encodeURIComponent(activePairSym) + '&tf=' + activeTF;
    const res  = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('connStatus').textContent = 'Live ●';
    document.getElementById('connStatus').className   = 'status live';
    if (data && data.symbol) {
      dataReceivedAt = Date.now();
      renderData(data);
    } else {
      document.getElementById('connStatus').textContent = 'Connected – no data yet';
    }
  } catch(e) {
    document.getElementById('connStatus').textContent = 'Offline – MT5 not sending';
    document.getElementById('connStatus').className   = 'status';
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderData(d) {
  const bias = (d.bias || 'neutral').toLowerCase();
  const bCol = bias === 'bullish' ? '#4ade80' : bias === 'bearish' ? '#f87171' : '#a8a29e';

  document.getElementById('m-sym').textContent   = (d.symbol || '—') + ' ' + (d.timeframe || '');
  document.getElementById('m-price').textContent = d.price || '—';
  document.getElementById('m-bias').textContent  = bias.charAt(0).toUpperCase() + bias.slice(1);
  document.getElementById('m-bias').style.color  = bCol;
  document.getElementById('m-score').textContent = (d.bias_score > 0 ? '+' : '') + (d.bias_score || 0);
  document.getElementById('m-score').style.color = bCol;
  document.getElementById('m-rsi').textContent   = d.rsi ? parseFloat(d.rsi).toFixed(1) : '—';
  document.getElementById('m-ema').textContent   = d.ema_bias ? d.ema_bias.charAt(0).toUpperCase() + d.ema_bias.slice(1) : '—';
  document.getElementById('m-ema').style.color   = d.ema_bias === 'bullish' ? '#4ade80' : '#f87171';

  // ── Patterns ─────────────────────────────────────────────────────────────
  const pats = d.patterns || [];
  document.getElementById('patCount').textContent = pats.length + ' total';

  if (!pats.length) {
    document.getElementById('patList').innerHTML = '<div class="empty">No patterns in last 10 bars</div>';
  } else {
    // Sort: most recent first (lowest bar_index first)
    const sorted = [...pats].sort((a, b) => (a.bar_index || 0) - (b.bar_index || 0));

    const recent = sorted.filter(p => ageClass(p.bar_index || 99) === 'recent');
    const mid    = sorted.filter(p => ageClass(p.bar_index || 99) === 'mid');
    const stale  = sorted.filter(p => ageClass(p.bar_index || 99) === 'stale');

    function patHTML(p, isStale) {
      const conf     = p.confidence_pct || 55;
      const cc       = confColor(conf);
      const bi       = p.bar_index != null ? p.bar_index : 99;
      const age      = ageClass(bi);
      const timeText = barAgoLabel(bi);
      const dots     = [1,2,3,4,5].map(i =>
        `<span class="d${i <= p.strength ? (p.type==='bull' ? ' d-bull' : ' d-bear') : ''}"></span>`
      ).join('');

      let timeBadge = '';
      if (age === 'recent' && bi === 0) {
        timeBadge = '<span class="badge badge-new">● Just now</span>';
      } else if (age === 'recent') {
        timeBadge = `<span class="badge badge-recent">${timeText}</span>`;
      } else if (age === 'stale') {
        timeBadge = `<span class="badge badge-stale">⚠ STALE · ${timeText}</span>`;
      }

      return `<div class="pat-row${isStale ? ' stale' : ''}">
        <div class="pat-meta">
          <div class="pat-name">
            ${p.name || p.pattern_name || 'Unknown'}
            ${timeBadge}
          </div>
          <div class="pat-time">${age !== 'recent' && age !== 'stale' ? timeText : ''}</div>
        </div>
        <span class="badge badge-${p.type === 'bull' ? 'bull' : p.type === 'bear' ? 'bear' : 'neu'}">
          ${p.type === 'bull' ? '▲' : p.type === 'bear' ? '▼' : '●'} ${p.type || 'neu'}
        </span>
        <div class="conf-wrap">
          <div class="str-dots">${dots}</div>
          <div class="conf-track"><div class="conf-fill" style="width:${conf}%;background:${cc}"></div></div>
          <span class="conf-pct" style="color:${cc}">${conf}%</span>
        </div>
      </div>`;
    }

    let html = '';
    if (recent.length) html += recent.map(p => patHTML(p, false)).join('');
    if (mid.length)    html += mid.map(p => patHTML(p, false)).join('');
    if (stale.length) {
      html += `<div class="stale-divider">⚠ Older patterns — may no longer be valid</div>`;
      html += stale.map(p => patHTML(p, true)).join('');
    }

    document.getElementById('patList').innerHTML = html;
  }

  // ── Support / Resistance only (demand/supply removed) ────────────────────
  const sr = d.sr_levels || [];
  document.getElementById('srList').innerHTML = sr.length
    ? sr.map(z => `<div class="zone-row z-${z.type === 'support' ? 'support' : 'resist'}">
        <span>${z.type === 'support' ? '▲ Support' : '▼ Resistance'}</span>
        <span style="font-family:monospace;font-size:11px">${z.price}</span>
      </div>`).join('')
    : '<div class="empty">No S/R levels</div>';

  // ── Recent candles filtered by trend alignment ───────────────────────────
  renderCandles(d.candles || d.m15_candles || [], bias);

  // ── Composite signal ──────────────────────────────────────────────────────
  const sc = bias === 'bullish' ? 'sv-bull' : bias === 'bearish' ? 'sv-bear' : 'sv-neu';
  const recentCount = pats.filter(p => ageClass(p.bar_index || 99) === 'recent').length;

  document.getElementById('sigRows').innerHTML = `
    <div class="sig-row"><span class="sl">Score</span><span class="${sc}">${d.bias_score > 0 ? '+' : ''}${d.bias_score || 0} / 100</span></div>
    <div class="sig-row"><span class="sl">Bias</span><span class="${sc}">${bias.charAt(0).toUpperCase() + bias.slice(1)}</span></div>
    <div class="sig-row"><span class="sl">RSI</span><span style="color:#e0e0e8;font-weight:500">${d.rsi ? parseFloat(d.rsi).toFixed(1) : '—'}</span></div>
    <div class="sig-row"><span class="sl">EMA bias</span><span class="${d.ema_bias === 'bullish' ? 'sv-bull' : 'sv-bear'}">${d.ema_bias || '—'}</span></div>
    <div class="sig-row"><span class="sl">Recent patterns</span><span style="color:#e0e0e8;font-weight:500">${recentCount} of ${pats.length}</span></div>
    <div class="sig-row"><span class="sl">Data age</span><span style="color:#6b7280;font-size:11px">${wallClockAge()}</span></div>
  `;

  const pct = Math.min(100, Math.max(0, (d.bias_score || 0) + 50));
  const bf  = bias === 'bullish' ? '#4ade80' : bias === 'bearish' ? '#f87171' : '#a8a29e';
  document.getElementById('sigBar').style.cssText =
    `width:${pct}%;background:${bf};height:100%;border-radius:4px;transition:width .6s,background .6s`;

  document.getElementById('lastUpdate').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
}

// ── Candle alignment renderer ─────────────────────────────────────────────────
// Only show candles that AGREE with the current bias.
// Bullish bias → show candles where close > open (green candles)
// Bearish bias → show candles where close < open (red candles)
// Neutral      → show last 5 candles regardless
function renderCandles(candles, bias) {
  const labelEl = document.getElementById('candleBiasLabel');
  const noteEl  = document.getElementById('candleTrendNote');
  const listEl  = document.getElementById('candleList');

  if (!candles || !candles.length) {
    labelEl.textContent = '';
    noteEl.style.display = 'none';
    listEl.innerHTML = '<div class="empty">No candle data</div>';
    return;
  }

  // Sort newest first (assume array index 0 = most recent, or sort by time if available)
  let sorted = [...candles];
  if (sorted[0] && sorted[0].time) {
    sorted.sort((a, b) => new Date(b.time) - new Date(a.time));
  }

  // Filter to trend-aligned candles
  let filtered;
  let noteText = '';

  if (bias === 'bullish') {
    filtered = sorted.filter(c => parseFloat(c.close) > parseFloat(c.open));
    labelEl.textContent = '— bullish alignment only';
    labelEl.style.color = '#4ade80';
    noteText = '▲ Showing bullish candles only — aligns with current BULLISH bias';
  } else if (bias === 'bearish') {
    filtered = sorted.filter(c => parseFloat(c.close) < parseFloat(c.open));
    labelEl.textContent = '— bearish alignment only';
    labelEl.style.color = '#f87171';
    noteText = '▼ Showing bearish candles only — aligns with current BEARISH bias';
  } else {
    filtered = sorted.slice(0, 5);
    labelEl.textContent = '— neutral (last 5)';
    labelEl.style.color = '#6b7280';
    noteText = '';
  }

  // Show only last 8 trend-aligned candles max
  const display = filtered.slice(0, 8);

  if (noteText) {
    noteEl.textContent = noteText;
    noteEl.style.display = 'block';
  } else {
    noteEl.style.display = 'none';
  }

  if (!display.length) {
    listEl.innerHTML = `<div class="empty">No ${bias} candles in recent data</div>`;
    return;
  }

  listEl.innerHTML = display.map((c, i) => {
    const o = parseFloat(c.open);
    const cl = parseFloat(c.close);
    const h = parseFloat(c.high);
    const l = parseFloat(c.low);
    const isBull = cl > o;
    const isBear = cl < o;
    const bodyPips = Math.abs(cl - o);
    const cls = isBull ? 'candle-bull' : isBear ? 'candle-bear' : 'candle-doji';
    const arrow = isBull ? '▲' : isBear ? '▼' : '●';
    const typeLabel = isBull ? 'Bull' : isBear ? 'Bear' : 'Doji';

    // Time label
    let timeLabel = '';
    if (c.time) {
      const t = new Date(c.time);
      timeLabel = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } else if (c.bar_index != null) {
      timeLabel = barAgoLabel(c.bar_index);
    }

    const isNewest = i === 0;

    return `<div class="candle-row ${cls}">
      <span class="candle-label">${arrow} ${typeLabel}</span>
      <span class="candle-prices">O:${o.toFixed(5)} C:${cl.toFixed(5)}</span>
      <span class="candle-age">${timeLabel}${isNewest ? ' <span class="candle-badge-new">NEW</span>' : ''}</span>
    </div>`;
  }).join('');
}

// Poll every 5 seconds
fetchData();
setInterval(fetchData, 5000);
</script>
</body>
</html>
